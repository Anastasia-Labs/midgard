name: Pinned Aiken
description: >-
  Nix, and the aiken that demo/flake.lock pins, built once and then restored
  from a cache keyed by the lock. Nothing goes on PATH: every script reaches
  the compiler through scripts/aiken (scripts/lib/aiken.mjs), which builds the
  locked commit, so a step cannot pick up any other aiken. Run
  actions/checkout before this action.

runs:
  using: composite
  steps:
    - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
      with:
        github_access_token: ${{ github.token }}
    - uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7.0.2
      with:
        primary-key: aiken-${{ runner.os }}-${{ hashFiles('demo/flake.lock') }}
    - name: Build the pinned aiken
      shell: bash
      run: scripts/aiken --version
