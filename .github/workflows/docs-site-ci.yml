name: Docs Site CI

on:
  push:
    branches: ["main"]
    paths:
      - "docs-site/**"
      - "**/*.md"
      - "**/*.mdx"
      - "demo/lucid-midgard/**"
      - "demo/midgard-core/**"
      - "demo/package.json"
      - "demo/pnpm-lock.yaml"
      - "demo/.nvmrc"
      - ".github/workflows/docs-site-ci.yml"
  pull_request:
    paths:
      - "docs-site/**"
      - "**/*.md"
      - "**/*.mdx"
      - "demo/lucid-midgard/**"
      - "demo/midgard-core/**"
      - "demo/package.json"
      - "demo/pnpm-lock.yaml"
      - "demo/.nvmrc"
      - ".github/workflows/docs-site-ci.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: demo/.nvmrc

      # The demo workspace pins pnpm 9; docs-site pins pnpm 10. Install the
      # workspace deps first, so the SDK packages can be built, then switch.
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          package_json_file: demo/package.json
      - name: Install demo workspace dependencies
        run: pnpm --dir demo install --frozen-lockfile

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          package_json_file: docs-site/package.json
      - name: Install docs-site dependencies
        run: pnpm --dir docs-site install --frozen-lockfile

      - name: Check repository-local documentation links
        run: pnpm --dir docs-site run check:links

      # `prebuild` builds midgard-core and lucid-midgard. The MDX code samples are
      # type-checked against them, so a sample naming a nonexistent export fails here.
      - name: Build docs site
        run: pnpm --dir docs-site run build

      - name: Typecheck docs site
        run: pnpm --dir docs-site exec tsc --noEmit
