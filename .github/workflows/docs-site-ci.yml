name: Docs Site CI

on:
  push:
    branches: ["main"]
    paths:
      - "docs-site/**"
      - "**/*.md"
      - "**/*.mdx"
      - "demo/lucid-midgard/**"
      - "demo/midgard-core/**"
      # Sources whose exported symbols the docs restate.
      # See docs-site/scripts/check-docs-facts.mjs.
      - "demo/midgard-node/src/fibers/index.ts"
      - "demo/midgard-node/src/index.ts"
      - "demo/midgard-node/src/mpf/transition-cbor.ts"
      - "demo/midgard-fault-proofs/src/bin.ts"
      - "demo/package.json"
      - "demo/pnpm-workspace.yaml"
      - "l1-services/.env.example"
      - "onchain/aiken/validators/da-attestation.ak"
      - "onchain/aiken/validators/da-params-governor.ak"
      - "technical-spec/1-ledger-state/1-block.tex"
      - ".github/workflows/docs-site-ci.yml"
  pull_request:
    paths:
      - "docs-site/**"
      - "**/*.md"
      - "**/*.mdx"
      - "demo/lucid-midgard/**"
      - "demo/midgard-core/**"
      # Sources whose exported symbols the docs restate.
      # See docs-site/scripts/check-docs-facts.mjs.
      - "demo/midgard-node/src/fibers/index.ts"
      - "demo/midgard-node/src/index.ts"
      - "demo/midgard-node/src/mpf/transition-cbor.ts"
      - "demo/midgard-fault-proofs/src/bin.ts"
      - "demo/package.json"
      - "demo/pnpm-workspace.yaml"
      - "l1-services/.env.example"
      - "onchain/aiken/validators/da-attestation.ak"
      - "onchain/aiken/validators/da-params-governor.ak"
      - "technical-spec/1-ledger-state/1-block.tex"
      - ".github/workflows/docs-site-ci.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # The demo workspace pins pnpm 9; docs-site pins pnpm 10. Install the
      # workspace deps first, so the SDK packages can be built, then switch.
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - name: Install demo workspace dependencies
        run: pnpm --dir demo install --frozen-lockfile

      - uses: pnpm/action-setup@v4
        with:
          version: 10.11.0
      - name: Install docs-site dependencies
        run: pnpm --dir docs-site install --frozen-lockfile

      # Fails when a fiber, CLI command, or transaction status named in the docs
      # no longer matches the source it is drawn from.
      - name: Check documented facts against source
        run: pnpm --dir docs-site run check:facts

      - name: Check repository-local documentation links
        run: pnpm --dir docs-site run check:links

      # `prebuild` builds midgard-core and lucid-midgard. The MDX code samples are
      # type-checked against them, so a sample naming a nonexistent export fails here.
      - name: Build docs site
        run: pnpm --dir docs-site run build

      - name: Typecheck docs site
        run: pnpm --dir docs-site exec tsc --noEmit
