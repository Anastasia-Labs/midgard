name: Agent Skills CI

# No path filter, on purpose. A skill goes stale when something it links to
# moves, and that change lands outside .agents/**; a filter scoped to the
# skills would skip exactly the change that broke them. The job takes seconds.
on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: agent-skills-${{ github.ref }}
  cancel-in-progress: true

jobs:
  skills:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: demo/.nvmrc

      - name: Test the skill checker
        run: node --test scripts/ci/check-agent-skills.test.mjs

      - name: Check skills and the .claude/skills link
        run: node scripts/ci/check-agent-skills.mjs

      # verify-pure-move parses TypeScript with the workspace's compiler and
      # skips those tests when it cannot resolve one. Installing only that
      # package (at the lockfile's version) keeps this job seconds long, and
      # VERIFY_PURE_MOVE_REQUIRE_TYPESCRIPT turns a missing compiler into a
      # failure instead of a quiet skip.
      - name: Provide the workspace TypeScript compiler
        run: |
          version=$(sed -n 's/^  typescript@\([0-9.]*\):.*/\1/p' demo/pnpm-lock.yaml | head -1)
          test -n "$version"
          npm install --prefix "$RUNNER_TEMP/typescript" --no-save --no-package-lock "typescript@$version"
          mkdir -p demo/node_modules
          ln -s "$RUNNER_TEMP/typescript/node_modules/typescript" demo/node_modules/typescript

      - name: Test scripts shipped inside skills
        env:
          VERIFY_PURE_MOVE_REQUIRE_TYPESCRIPT: "1"
        run: |
          mapfile -t tests < <(find .agents/skills -path '*/scripts/*.test.mjs' | sort)
          if [[ ${#tests[@]} -eq 0 ]]; then
            echo "no skill script tests yet"
            exit 0
          fi
          node --test "${tests[@]}"
