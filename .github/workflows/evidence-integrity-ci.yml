name: Evidence Integrity CI

on:
  # Scoped to `main` to match every other workflow in this repository
  # (aiken-ci, docs-site-ci, midgard-node-ci, latex-ci). An unrestricted
  # `push:` made this the only gate that ran TWICE per pull-request commit —
  # once for the push event and once for the pull_request event. Beyond
  # doubling the cost of the most expensive gate, the duplicate run reported
  # two independent samples under one check name, so a nondeterministic test
  # surfaced as "CI disagreeing with itself at the same commit" and cost real
  # time to attribute. Pull requests remain fully gated by the
  # `pull_request` trigger below.
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The format-registry verifier asserts that
          # registry.authority.sourceRevision is an ancestor of HEAD and that
          # the recorded source path existed at that revision. Both need real
          # history; actions/checkout defaults to a depth-1 shallow clone, in
          # which every such check fails regardless of correctness.
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version-file: demo/.nvmrc
          cache: pnpm
          cache-dependency-path: demo/pnpm-lock.yaml
      # #519 V-7: the F05 task-manifest quality gate was referenced by nothing
      # automated, so a published dependency claim ("blockedOn contains exactly
      # 1 current non-PASS dependency") stayed false until a manual audit found
      # it. These two steps run before the workspace install because both are
      # pure-node and need no dependencies; the workflow's unfiltered
      # `pull_request` trigger means every change to the manifest, its
      # templates, or the GOAL_PROGRESS.md queue it is reconciled against is
      # gated here.
      - name: Verify canonical V1 Goal task-manifest quality
        run: node demo/scripts/verify-canonical-v1-goal-task-manifest-quality.mjs
      - name: Self-test the task-manifest blocked-on reconciliation
        run: node demo/scripts/verify-canonical-v1-goal-task-manifest-quality-self-test.mjs
      - name: Install evidence-verifier dependencies
        run: pnpm --dir demo install --frozen-lockfile --ignore-scripts
      - name: Build focused-test workspace dependencies
        run: >-
          pnpm --dir demo/midgard-core run build &&
          pnpm --dir demo/midgard-sdk run build
      # Deliberately NOT part of `goal:verify:static`. The verification plan
      # forbids `--allow-incomplete` in any plan command, and the registry's
      # strict run is the `evidence` phase's `evidence-format-registry-strict`
      # gate for release. Until the remaining UNVERIFIED rows are closed, the
      # structural (incomplete-tolerant) form is the honest CI gate and is
      # invoked here directly rather than weakening a plan phase.
      - name: Verify incomplete canonical V1 format registry structure
        run: node demo/scripts/verify-canonical-v1-format-registry.mjs --allow-incomplete
      # #519 V-6: the registry's cross-language "not applicable" excuses were
      # free text, so an excuse could not be wrong. The self-test drives the
      # real gate against seeded excuses and layout mutations and requires each
      # to be rejected with its specific diagnostic.
      - name: Self-test the format-registry N/A bounds and exact-field pins
        run: node demo/scripts/verify-canonical-v1-format-registry-self-test.mjs
      - name: Verify canonical watcher dependency map
        run: node demo/scripts/verify-canonical-v1-watcher-dependency-map.mjs
      # #537: the map's §0-integrity revisions and the W13-W17/W23 review
      # claims were compared only to hardcoded copies of themselves, so a
      # nonexistent revision or an edited pair of literals passed CI. They are
      # git-bound now, and this self-test drives the real gate against seeded
      # provenance defects — a non-ancestor revision, tampered historical
      # bytes, a malformed review record — and requires each to be rejected
      # with its specific diagnostic.
      - name: Self-test the watcher dependency-map git-authority bindings
        run: node demo/scripts/verify-canonical-v1-watcher-dependency-map-self-test.mjs
      - name: Verify canonical watcher focused-test evidence
        run: node demo/scripts/verify-canonical-v1-watcher-focused-tests.mjs

  # #519 V-8: `verify-canonical-v1-header-v1-abi.mjs` holds the only comparison
  # of the format registry's L01 contract against BOTH real projections — the
  # blueprint the Aiken compiler generates and the Data schema the built SDK
  # exports at runtime — and its `run()` was invoked by nothing, so the row's
  # cross-language claim rested on that script's own success message. This job
  # exists because that comparison needs artifacts the `verify` job does not
  # produce: a compiled blueprint (no compiler there) and a built SDK. It is a
  # separate job rather than more steps in `verify` so the compiler setup and
  # `aiken build` do not lengthen the critical path of the pure-node gates,
  # and it is in THIS workflow, not `aiken-ci`, because that workflow is
  # path-filtered to `onchain/aiken/**` and would not run when the registry or
  # the SDK schema moves — which is exactly the drift this gate is for.
  header-v1-abi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aiken-lang/setup-aiken@v1.0.3
        with:
          # The released authority compiler, matching `aiken-ci`'s `aiken
          # build` and every applied validator hash in release evidence. The
          # patched fork is for executing tests only and must not produce the
          # blueprint an ABI claim is measured against.
          version: v1.1.22
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version-file: demo/.nvmrc
          cache: pnpm
          cache-dependency-path: demo/pnpm-lock.yaml
      - name: Install workspace dependencies
        run: pnpm --dir demo install --frozen-lockfile --ignore-scripts
      - name: Build the SDK whose runtime schema is compared
        run: >-
          pnpm --dir demo/midgard-core run build &&
          pnpm --dir demo/midgard-sdk run build
      - name: Generate the Aiken blueprint the ABI gate compares against
        working-directory: onchain/aiken
        run: aiken build
      # The real three-way comparison. Both artifacts above are inputs it did
      # not synthesize; the gate fails closed if either is missing.
      - name: Verify HeaderV1 ABI against the real blueprint and SDK schema
        run: node demo/scripts/verify-canonical-v1-header-v1-abi.mjs
      # The registry's L01 cross-language row cites this suite's real-projection
      # case by name, so the row's evidence is only as good as this run.
      - name: Run the HeaderV1 ABI contract test suite
        run: node --test demo/scripts/verify-canonical-v1-header-v1-abi.test.mjs
      # An uninvoked gate and a gate that cannot fail are the same defect. The
      # self-test seeds a mismatch into exactly one of the three inputs at a
      # time — leaving the other two real — and requires each run to exit
      # non-zero with its specific diagnostic.
      - name: Self-test the HeaderV1 ABI gate against seeded mismatches
        run: node demo/scripts/verify-canonical-v1-header-v1-abi-self-test.mjs

  # GOAL_SPEC.md §7 F40: "wires `goal:verify:static` into repository CI for the
  # Goal branch so drift is caught between checkpoints." This job runs the
  # static phase exactly as the plan defines it — no extra commands, no removed
  # ones — so CI and a local `pnpm --dir demo run goal:verify:static` cannot
  # disagree.
  goal-static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The closure verifier asserts that the checked-out branch equals the
          # manifest's declared branch and that the recorded revision descends
          # into HEAD. A detached PR merge commit has no branch name and a
          # shallow clone has no ancestry, so check out the head branch itself
          # at full depth.
          ref: ${{ github.head_ref || github.ref }}
          fetch-depth: 0
      - name: Resolve the Goal branch this closure manifest binds
        id: scope
        run: |
          set -euo pipefail
          declared="$(node -e 'process.stdout.write(JSON.parse(require("node:fs").readFileSync("docs/exec-plans/evidence/canonical-v1-goal-closure-v1.json","utf8")).revision.branch)')"
          actual="$(git branch --show-current)"
          printf 'declared Goal branch: %s\nchecked-out branch:  %s\n' "$declared" "$actual"
          if [ "$declared" = "$actual" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Not the Goal branch: the static Goal phase is scoped to ${declared} and is not run here."
          fi
      - uses: aiken-lang/setup-aiken@v1.0.3
        if: steps.scope.outputs.run == 'true'
        with:
          # The static phase asserts this compiler equals the version declared
          # in onchain/aiken/aiken.toml, so it must be the released authority
          # compiler, not the patched test fork used by Aiken CI.
          version: v1.1.22
      - uses: pnpm/action-setup@v4
        if: steps.scope.outputs.run == 'true'
        with:
          version: 9
      - uses: actions/setup-node@v4
        if: steps.scope.outputs.run == 'true'
        with:
          node-version-file: demo/.nvmrc
          cache: pnpm
          cache-dependency-path: demo/pnpm-lock.yaml
      - name: Install workspace dependencies
        if: steps.scope.outputs.run == 'true'
        run: pnpm --dir demo install --frozen-lockfile
      - name: Run the Goal static verification phase
        if: steps.scope.outputs.run == 'true'
        run: pnpm --dir demo run goal:verify:static
