name: Evidence Integrity CI

on:
  # Scoped to `main` to match every other workflow in this repository
  # (aiken-ci, docs-site-ci, midgard-node-ci, latex-ci). An unrestricted
  # `push:` made this the only gate that ran TWICE per pull-request commit —
  # once for the push event and once for the pull_request event. Beyond
  # doubling the cost of the most expensive gate, the duplicate run reported
  # two independent samples under one check name, so a nondeterministic test
  # surfaced as "CI disagreeing with itself at the same commit" and cost real
  # time to attribute. Pull requests remain fully gated by the
  # `pull_request` trigger below.
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

# THE COMPILER PIN, shared by both compiler-bearing jobs below. Issue #579,
# rider 1, and the owner's 2026-08-13 ruling A: the patched fork is the SOLE
# compiler, and it is what defines deployed script identity. Stock v1.1.22 is
# retired from every role and is no longer installed by this workflow.
#
# This workflow held the released pin the longest, on the argument that a job
# which MEASURES identity must use the released compiler rather than the test
# fork. That argument now points the other way. Stock v1.1.22 keys generated
# expect-decoders by LOCAL type name with no module path (issue #521), so two
# same-named types in different modules share one decoder; `MintRedeemer` is
# declared in 12 modules on this tree, and the retirement snapshot recorded in
# `aiken-ci.yml` measured the consequence — the stock blueprint's
# `user_events/tx_order_v1.mint` is the WRONG artifact (81fa79f4…, 9,851 bytes
# against the fork's b5541807…, 10,071 bytes). An ABI or freeze claim measured
# against that blueprint is measured against bytes no deployment carries, so
# the compiler that defines identity is the only one either job may use.
#
# All four arms of rider 1's pin, so a reviewer on other hardware can
# reproduce the toolchain rather than take it on trust:
#   repo    https://github.com/Anastasia-Labs/aiken   (org-controlled)
#   tag     midgard-2a78108c                          (annotated, immutable)
#   commit  2a78108ccb184161689b8a06c84d942e13b5b209
#   md5     b3acfdf348235798cb6b921d0f87750a          (published in the tag
#                                                      message, so it is fixed
#                                                      once for everyone)
# The version string `v1.1.23+2a78108` is derived from the commit at build
# time, so it is the arm that reproduces from source anywhere; the md5 is a
# released-artifact hash and is pinned as provenance, not as a build-time
# equality check (two honest builds of one tag on two machines need not agree
# byte for byte).
env:
  AIKEN_FORK_REPO: https://github.com/Anastasia-Labs/aiken
  AIKEN_FORK_TAG: midgard-2a78108c
  AIKEN_FORK_REV: 2a78108ccb184161689b8a06c84d942e13b5b209
  AIKEN_FORK_VERSION: aiken v1.1.23+2a78108
  AIKEN_FORK_BINARY_MD5: b3acfdf348235798cb6b921d0f87750a

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The format-registry verifier asserts that
          # registry.authority.sourceRevision is an ancestor of HEAD and that
          # the recorded source path existed at that revision. Both need real
          # history; actions/checkout defaults to a depth-1 shallow clone, in
          # which every such check fails regardless of correctness.
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version-file: demo/.nvmrc
          cache: pnpm
          cache-dependency-path: demo/pnpm-lock.yaml
      # #519 V-7: the F05 task-manifest quality gate was referenced by nothing
      # automated, so a published dependency claim ("blockedOn contains exactly
      # 1 current non-PASS dependency") stayed false until a manual audit found
      # it. These two steps run before the workspace install because both are
      # pure-node and need no dependencies; the workflow's unfiltered
      # `pull_request` trigger means every change to the manifest, its
      # templates, or the GOAL_PROGRESS.md queue it is reconciled against is
      # gated here.
      # The gate runs against the ruling-B accepted-defect enumeration
      # (owner-accepted 2026-08-14, re-pinned by #613): the strict measurement
      # still reports every defect, but only defects OUTSIDE the standing
      # enumeration fail CI. The gate fails closed (exit 2) if the artifact is
      # missing or carries no standing enumeration (#614).
      - name: Verify canonical V1 Goal task-manifest quality
        run: >-
          node demo/scripts/verify-canonical-v1-goal-task-manifest-quality.mjs
          --accepted-defects=docs/exec-plans/evidence/canonical-v1-strict-manifest-quality-accepted-defects-v1.json
      - name: Self-test the task-manifest blocked-on reconciliation
        run: node demo/scripts/verify-canonical-v1-goal-task-manifest-quality-self-test.mjs
      # Scripts must run here (matching midgard-node-ci's install): the
      # @aiken-lang/merkle-patricia-forestry git dependency only gains its
      # dist/ (and type declarations) from its prepare script, and
      # midgard-validation's DTS build fails without them.
      - name: Install evidence-verifier dependencies
        run: pnpm --dir demo install --frozen-lockfile
      # Dependency order: core -> sdk -> validation -> fault-proofs. The
      # watcher suite imports @al-ft/midgard-validation and
      # @al-ft/midgard-fault-proofs directly (block-replay, phase-a-verifier,
      # header-root-reconstruction, event-classification-verifier), so their
      # dist/ entries must exist or Vite fails entry resolution at collect
      # time.
      - name: Build focused-test workspace dependencies
        run: >-
          pnpm --dir demo/midgard-core run build &&
          pnpm --dir demo/midgard-sdk run build &&
          pnpm --dir demo/midgard-validation run build &&
          pnpm --dir demo/midgard-fault-proofs run build
      # Deliberately NOT part of `goal:verify:static`. The verification plan
      # forbids `--allow-incomplete` in any plan command, and the registry's
      # strict run is the `evidence` phase's `evidence-format-registry-strict`
      # gate for release. Until the remaining UNVERIFIED rows are closed, the
      # structural (incomplete-tolerant) form is the honest CI gate and is
      # invoked here directly rather than weakening a plan phase.
      - name: Verify incomplete canonical V1 format registry structure
        run: node demo/scripts/verify-canonical-v1-format-registry.mjs --allow-incomplete
      # #519 V-6: the registry's cross-language "not applicable" excuses were
      # free text, so an excuse could not be wrong. The self-test drives the
      # real gate against seeded excuses and layout mutations and requires each
      # to be rejected with its specific diagnostic.
      - name: Self-test the format-registry N/A bounds and exact-field pins
        run: node demo/scripts/verify-canonical-v1-format-registry-self-test.mjs
      - name: Verify canonical watcher dependency map
        run: node demo/scripts/verify-canonical-v1-watcher-dependency-map.mjs
      # #537: the map's §0-integrity revisions and the W13-W17/W23 review
      # claims were compared only to hardcoded copies of themselves, so a
      # nonexistent revision or an edited pair of literals passed CI. They are
      # git-bound now, and this self-test drives the real gate against seeded
      # provenance defects — a non-ancestor revision, tampered historical
      # bytes, a malformed review record — and requires each to be rejected
      # with its specific diagnostic.
      - name: Self-test the watcher dependency-map git-authority bindings
        run: node demo/scripts/verify-canonical-v1-watcher-dependency-map-self-test.mjs
      - name: Verify canonical watcher focused-test evidence
        run: node demo/scripts/verify-canonical-v1-watcher-focused-tests.mjs
      # B34/#510: CG4 is the consolidated ABI/fund-safety review. It reconciles
      # the nine C60-C68 classification rows against the F05 manifest and the
      # index and refuses PASS while any is unmeasured, so it must run wherever
      # the manifest, the reconciliation or the ABI freeze can move. It is
      # pure-node and needs no compiler.
      - name: Verify canonical V1 CG4 fund-safety and classification gate
        run: node demo/scripts/verify-canonical-v1-cg4-fund-safety-classification-gate.mjs
      # An uninvoked gate and a gate that cannot fail are the same defect. This
      # self-test drives the real CG4 gate against seeded promotions — a row
      # promoted past its missing surfaces, QG1 promoted while its verifier does
      # not exist, a tampered ABI-freeze digest — and requires each to be
      # rejected with its specific diagnostic.
      - name: Self-test the CG4 gate against seeded promotions
        run: node demo/scripts/verify-canonical-v1-cg4-fund-safety-classification-gate-self-test.mjs
      # #479/CG1: every parameterized hub/control validator must fit a real
      # 16,384-byte publication transaction. The gate recomputes the roster
      # from nodeRuntimeReferenceScriptTargets and fails closed on drift, a
      # missing or invented validator, an unjustified exclusion, or a stale
      # pin. The blueprint itself is gitignored and structurally absent from
      # a fresh checkout, so ONLY the working-tree blueprint-hash comparison
      # is relaxed here; it enforces wherever a working tree carries the
      # blueprint, and re-pins at #510's freeze-event regeneration.
      - name: Verify canonical V1 CG1 control-publication fit gate
        run: node demo/scripts/verify-canonical-v1-cg1-control-publication-fit.mjs --blueprint-optional
      # An uninvoked gate and a gate that cannot fail are the same defect.
      - name: Self-test the CG1 gate against seeded mutations
        run: node demo/scripts/verify-canonical-v1-cg1-control-publication-fit-self-test.mjs

  # #519 V-8: `verify-canonical-v1-header-v1-abi.mjs` holds the only comparison
  # of the format registry's L01 contract against BOTH real projections — the
  # blueprint the Aiken compiler generates and the Data schema the built SDK
  # exports at runtime — and its `run()` was invoked by nothing, so the row's
  # cross-language claim rested on that script's own success message. This job
  # exists because that comparison needs artifacts the `verify` job does not
  # produce: a compiled blueprint (no compiler there) and a built SDK. It is a
  # separate job rather than more steps in `verify` so the compiler setup and
  # `aiken build` do not lengthen the critical path of the pure-node gates,
  # and it is in THIS workflow, not `aiken-ci`, because that workflow is
  # path-filtered to `onchain/aiken/**` and would not run when the registry or
  # the SDK schema moves — which is exactly the drift this gate is for.
  header-v1-abi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # No `setup-aiken` step: the fork is the compiler here for the reason
      # given at the top of this file, and it is installed exactly the way
      # `aiken-ci` installs it — same cache path, same key shape, same rev — so
      # the blueprint this job measures against and the blueprint that workflow
      # builds cannot come from two different compilers.
      - name: Cache the pinned Aiken fork
        id: aiken-fork
        uses: actions/cache@v4
        with:
          path: ~/.aiken-fork
          key: aiken-fork-${{ env.AIKEN_FORK_REV }}-${{ runner.os }}
      - name: Build the pinned Aiken fork
        if: steps.aiken-fork.outputs.cache-hit != 'true'
        run: |
          rustup toolchain install 1.94.1 --profile minimal
          # --locked honours the fork's committed Cargo.lock; without it cargo
          # re-resolves every dependency on each cache miss, so an unrelated
          # crate release could redden this branch or silently change the
          # compiler this job's ABI evidence was produced by.
          cargo +1.94.1 install \
            --git "$AIKEN_FORK_REPO" \
            --rev "$AIKEN_FORK_REV" \
            --locked \
            --root ~/.aiken-fork \
            aiken
      # Assert, don't just print: a cache poisoned by an earlier rev must fail
      # here rather than silently changing which compiler produced the
      # blueprint every gate below is measured against. Putting the fork on
      # PATH is what makes it the compiler for `aiken build` AND for any gate
      # script that spawns a bare `aiken`. There is no second compiler on PATH
      # to fall through to.
      - name: Assert the pinned compiler identity and put it on PATH
        run: |
          set -euo pipefail
          patched="$(~/.aiken-fork/bin/aiken --version)"
          printf 'pinned fork: %s\nexpected:    %s\n' "$patched" "$AIKEN_FORK_VERSION"
          test "$patched" = "$AIKEN_FORK_VERSION"
          test "$patched" = "aiken v1.1.23+${AIKEN_FORK_REV:0:7}"
          echo "$HOME/.aiken-fork/bin" >> "$GITHUB_PATH"
      - name: Assert no stock compiler is reachable
        run: |
          set -euo pipefail
          # Fail closed if a stock binary ever returns to PATH: a step that
          # silently compiled under v1.1.22 would publish the wrong identity,
          # and this is the cheapest place to notice.
          resolved="$(command -v aiken)"
          version="$(aiken --version)"
          printf 'aiken on PATH: %s (%s)\n' "$resolved" "$version"
          test "$version" = "$AIKEN_FORK_VERSION"
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version-file: demo/.nvmrc
          cache: pnpm
          cache-dependency-path: demo/pnpm-lock.yaml
      - name: Install workspace dependencies
        run: pnpm --dir demo install --frozen-lockfile --ignore-scripts
      - name: Build the SDK whose runtime schema is compared
        run: >-
          pnpm --dir demo/midgard-core run build &&
          pnpm --dir demo/midgard-sdk run build
      - name: Generate the Aiken blueprint the ABI gate compares against
        working-directory: onchain/aiken
        run: aiken build
      # The real three-way comparison. Both artifacts above are inputs it did
      # not synthesize; the gate fails closed if either is missing.
      - name: Verify HeaderV1 ABI against the real blueprint and SDK schema
        run: node demo/scripts/verify-canonical-v1-header-v1-abi.mjs
      # The registry's L01 cross-language row cites this suite's real-projection
      # case by name, so the row's evidence is only as good as this run.
      - name: Run the HeaderV1 ABI contract test suite
        run: node --test demo/scripts/verify-canonical-v1-header-v1-abi.test.mjs
      # An uninvoked gate and a gate that cannot fail are the same defect. The
      # self-test seeds a mismatch into exactly one of the three inputs at a
      # time — leaving the other two real — and requires each run to exit
      # non-zero with its specific diagnostic.
      - name: Self-test the HeaderV1 ABI gate against seeded mismatches
        run: node demo/scripts/verify-canonical-v1-header-v1-abi-self-test.mjs
      # B34/#510 IG1/IG2. The ABI freeze binds the seven deployment-ABI
      # identities that midgard-core, midgard-node and midgard-sdk each declare
      # separately, the catalogue-to-validator-tree bijection, and the blueprint
      # the pinned compiler produced. It lives in THIS job rather than `verify`
      # because the blueprint leg needs a real `aiken build`, which that job has
      # no compiler for; the gate fails closed when the blueprint is missing
      # rather than skipping the check.
      - name: Verify canonical V1 ABI freeze against the real blueprint
        run: node demo/scripts/verify-canonical-v1-abi-freeze.mjs
      # The freeze's own hostile suite: 23 seeded mutations, including two that
      # seed a single package's identity source and leave the others real, so
      # the cross-package comparison cannot be satisfied by the artifact alone.
      - name: Self-test the ABI freeze against seeded drift
        run: node demo/scripts/verify-canonical-v1-abi-freeze-self-test.mjs

  # GOAL_SPEC.md §7 F40: "wires `goal:verify:static` into repository CI for the
  # Goal branch so drift is caught between checkpoints." This job runs the
  # static phase exactly as the plan defines it — no extra commands, no removed
  # ones — so CI and a local `pnpm --dir demo run goal:verify:static` cannot
  # disagree.
  goal-static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The closure verifier asserts that the checked-out branch equals the
          # manifest's declared branch and that the recorded revision descends
          # into HEAD. A detached PR merge commit has no branch name and a
          # shallow clone has no ancestry, so check out the head branch itself
          # at full depth.
          ref: ${{ github.head_ref || github.ref }}
          fetch-depth: 0
      - name: Resolve the Goal branch this closure manifest binds
        id: scope
        run: |
          set -euo pipefail
          declared="$(node -e 'process.stdout.write(JSON.parse(require("node:fs").readFileSync("docs/exec-plans/evidence/canonical-v1-goal-closure-v1.json","utf8")).revision.branch)')"
          actual="$(git branch --show-current)"
          printf 'declared Goal branch: %s\nchecked-out branch:  %s\n' "$declared" "$actual"
          if [ "$declared" = "$actual" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Not the Goal branch: the static Goal phase is scoped to ${declared} and is not run here."
          fi
      # The static phase asserts that the compiler on PATH agrees with the
      # version `onchain/aiken/aiken.toml` declares. That assertion used to be
      # the argument FOR the released pin; it is now the argument against it.
      # aiken.toml declares `v1.1.23` — the compiler this tree is defined by
      # under the owner's 2026-08-13 ruling A — and the policy gate
      # (`demo/scripts/verify-canonical-v1-goal-static-policy.mjs`) compares the
      # arm left of the `+`, so the fork's `aiken v1.1.23+2a78108` satisfies it
      # and stock v1.1.22 no longer can. The phase then runs `aiken check
      # --skip-tests` against `onchain/aiken`, which is a type-check of the
      # deployed tree and so has to run under the compiler that defines it.
      #
      # Installed exactly as in `header-v1-abi` above and in `aiken-ci`; every
      # step carries this job's scope guard as well, because the whole phase is
      # skipped off the Goal branch and building a compiler for a phase that
      # will not run is pure cost.
      - name: Cache the pinned Aiken fork
        id: aiken-fork
        if: steps.scope.outputs.run == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.aiken-fork
          key: aiken-fork-${{ env.AIKEN_FORK_REV }}-${{ runner.os }}
      - name: Build the pinned Aiken fork
        if: steps.scope.outputs.run == 'true' && steps.aiken-fork.outputs.cache-hit != 'true'
        run: |
          rustup toolchain install 1.94.1 --profile minimal
          # --locked honours the fork's committed Cargo.lock; without it cargo
          # re-resolves every dependency on each cache miss, so an unrelated
          # crate release could redden this branch or silently change the
          # compiler the static phase was verified under.
          cargo +1.94.1 install \
            --git "$AIKEN_FORK_REPO" \
            --rev "$AIKEN_FORK_REV" \
            --locked \
            --root ~/.aiken-fork \
            aiken
      # Assert, don't just print: a cache poisoned by an earlier rev must fail
      # here rather than silently changing which compiler the phase ran under.
      # Putting the fork on PATH is what makes it the compiler for the phase's
      # `aiken check --skip-tests` and for the policy gate's own `aiken
      # --version` probe, both of which spawn a bare `aiken`.
      - name: Assert the pinned compiler identity and put it on PATH
        if: steps.scope.outputs.run == 'true'
        run: |
          set -euo pipefail
          patched="$(~/.aiken-fork/bin/aiken --version)"
          printf 'pinned fork: %s\nexpected:    %s\n' "$patched" "$AIKEN_FORK_VERSION"
          test "$patched" = "$AIKEN_FORK_VERSION"
          test "$patched" = "aiken v1.1.23+${AIKEN_FORK_REV:0:7}"
          echo "$HOME/.aiken-fork/bin" >> "$GITHUB_PATH"
      - name: Assert no stock compiler is reachable
        if: steps.scope.outputs.run == 'true'
        run: |
          set -euo pipefail
          # Fail closed if a stock binary ever returns to PATH: a phase that
          # silently type-checked under v1.1.22 would report a verdict about a
          # tree no deployment compiles, and this is the cheapest place to
          # notice.
          resolved="$(command -v aiken)"
          version="$(aiken --version)"
          printf 'aiken on PATH: %s (%s)\n' "$resolved" "$version"
          test "$version" = "$AIKEN_FORK_VERSION"
      - uses: pnpm/action-setup@v4
        if: steps.scope.outputs.run == 'true'
        with:
          version: 9
      - uses: actions/setup-node@v4
        if: steps.scope.outputs.run == 'true'
        with:
          node-version-file: demo/.nvmrc
          cache: pnpm
          cache-dependency-path: demo/pnpm-lock.yaml
      - name: Install workspace dependencies
        if: steps.scope.outputs.run == 'true'
        run: pnpm --dir demo install --frozen-lockfile
      - name: Run the Goal static verification phase
        if: steps.scope.outputs.run == 'true'
        run: pnpm --dir demo run goal:verify:static
