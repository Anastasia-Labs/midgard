name: Aiken CI

on:
  push:
    branches: ["main"]
    paths:
      - onchain/aiken/**
  pull_request:
    paths:
      - onchain/aiken/**

env:
  # THE COMPILER PIN. Issue #579, rider 1, and the owner's 2026-08-13 ruling A:
  # the patched fork is the SOLE compiler for `fmt`, `build` and `check`, and it
  # is what defines deployed script identity. Stock v1.1.22 is retired from
  # every role and is no longer installed by this workflow.
  #
  # All four arms of rider 1's pin, so a reviewer on other hardware can
  # reproduce the toolchain rather than take it on trust:
  #   repo    https://github.com/Anastasia-Labs/aiken   (org-controlled)
  #   tag     midgard-2a78108c                          (annotated, immutable)
  #   commit  2a78108ccb184161689b8a06c84d942e13b5b209
  #   md5     b3acfdf348235798cb6b921d0f87750a          (published in the tag
  #                                                      message, so it is fixed
  #                                                      once for everyone)
  # The version string `v1.1.23+2a78108` is derived from the commit at build
  # time, so it is the arm that reproduces from source anywhere; the md5 is a
  # released-artifact hash and is pinned as provenance, not as a build-time
  # equality check (two honest builds of one tag on two machines need not agree
  # byte for byte).
  #
  # Why the pin advanced from 6d14ab2d to the tag: the owner's 2026-08-13
  # ruling B settles the immutable tag at 2a78108c. The wall-clock figure the
  # previous pin was chosen on (`aiken check` in 735.9 s / 819 tests / 0
  # failures on 4 vCPU) has NOT been re-taken on the tip; it is recorded as
  # not-re-measured rather than quietly restated. The headroom makes that safe
  # to defer: 735.9 s is 12.3 minutes against this job's 360-minute ceiling.
  # The diff between the two revisions is `chore: satisfy clippy 1.97` — lint
  # idiom across the LSP, blueprint, telemetry and `tx simulate` paths plus one
  # `Display` helper in `uplc::flat`, with no file under code generation or
  # evaluation touched — and the equivalence is verified rather than argued:
  # the #574 §8.10 carriage ledger, pinned under 6d14ab2, re-verifies to the
  # unit under 2a78108.
  AIKEN_FORK_REPO: https://github.com/Anastasia-Labs/aiken
  AIKEN_FORK_TAG: midgard-2a78108c
  AIKEN_FORK_REV: 2a78108ccb184161689b8a06c84d942e13b5b209
  AIKEN_FORK_VERSION: aiken v1.1.23+2a78108
  AIKEN_FORK_BINARY_MD5: b3acfdf348235798cb6b921d0f87750a

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: ./onchain/aiken
    steps:
      - uses: actions/checkout@v3
      # No `setup-aiken` step: stock v1.1.22 is retired from every role by the
      # owner's 2026-08-13 ruling A, so this workflow installs exactly one
      # compiler. The fork both compiles and executes. Two reasons it has to be
      # the fork rather than the release:
      #   1. Identity. Stock v1.1.22 keys generated expect-decoders by LOCAL
      #      type name with no module path (issue #521), so two same-named types
      #      in different modules share one decoder. That bites live on this
      #      tree: `MintRedeemer` is shared by 12 modules, and the stock
      #      blueprint's `user_events/tx_order_v1.mint` is the WRONG artifact.
      #      The retirement snapshot below records the measurement.
      #   2. Runtime. Upstream aiken#1389 makes a full stock `aiken check` take
      #      485 minutes on this tree against a 360-minute job ceiling, so a
      #      stock-executed suite could never pass here at all.
      - name: Cache the pinned Aiken fork
        id: aiken-fork
        uses: actions/cache@v4
        with:
          path: ~/.aiken-fork
          key: aiken-fork-${{ env.AIKEN_FORK_REV }}-${{ runner.os }}
      - name: Build the pinned Aiken fork
        if: steps.aiken-fork.outputs.cache-hit != 'true'
        working-directory: .
        run: |
          rustup toolchain install 1.94.1 --profile minimal
          # --locked honours the fork's committed Cargo.lock; without it cargo
          # re-resolves every dependency on each cache miss, so an unrelated
          # crate release could redden this branch or silently change the
          # toolchain the measurement above was taken on.
          cargo +1.94.1 install \
            --git "$AIKEN_FORK_REPO" \
            --rev "$AIKEN_FORK_REV" \
            --locked \
            --root ~/.aiken-fork \
            aiken
      # Assert, don't just print: a cache poisoned by an earlier rev must fail
      # here rather than silently changing which compiler produced the result.
      # Putting the fork on PATH is what makes it the compiler for every later
      # step AND for the scripts those steps invoke — `aiken fmt`,
      # `aiken build`, `aiken check`, and the shell/node helpers that spawn a
      # bare `aiken`. There is no second compiler on PATH to fall through to.
      - name: Assert the pinned compiler identity and put it on PATH
        run: |
          set -euo pipefail
          patched="$(~/.aiken-fork/bin/aiken --version)"
          printf 'pinned fork: %s\nexpected:    %s\n' "$patched" "$AIKEN_FORK_VERSION"
          test "$patched" = "$AIKEN_FORK_VERSION"
          test "$patched" = "aiken v1.1.23+${AIKEN_FORK_REV:0:7}"
          echo "$HOME/.aiken-fork/bin" >> "$GITHUB_PATH"
      - name: Assert no stock compiler is reachable
        run: |
          set -euo pipefail
          # Fail closed if a stock binary ever returns to PATH: a step that
          # silently compiled under v1.1.22 would publish the wrong identity,
          # and this is the cheapest place to notice.
          resolved="$(command -v aiken)"
          version="$(aiken --version)"
          printf 'aiken on PATH: %s (%s)\n' "$resolved" "$version"
          test "$version" = "$AIKEN_FORK_VERSION"
      - name: Verify generated user events witness prefix
        if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'pull_request' && github.base_ref == 'main')
        working-directory: .
        run: |
          ./scripts/generate-user-events-witness-script-prefix.sh
          git diff --name-only --exit-code onchain/aiken/env/default.ak onchain/aiken/env/testnet.ak
      # The two guard self-tests run BEFORE the formatter check, and the
      # position is deliberate. They are the gates that prove the other gates
      # can fail; they need no compiler, no cache and no toolchain, and they
      # finish in seconds. Behind the formatter check they were conditional on
      # it: every step after the first failure is `skipped`, so a formatting
      # drift in any one of the 408 tracked .ak files took the gate-can-fail
      # evidence offline along with the suite — which is exactly what had
      # happened, in nine files, when #577's round-2 review looked. Nothing is
      # weakened by the move: `aiken fmt` still runs below and still fails the
      # job, and the steps that genuinely need a compiler still sit after it.
      #
      # Issue #523. A focused `aiken check -m <selector>` whose selector matches
      # nothing prints an empty report and exits 0, so every gate citing it
      # reports success while running no tests. scripts/guard-focused-selector.mjs
      # turns that into a nonzero exit naming the selector; its self-test
      # includes the negative case, and an unguarded guard is worth nothing.
      - name: Self-test the fail-closed focused-selector guard
        run: node --test scripts/guard-focused-selector.test.mjs
      # Issue #577. Same reasoning one level up: the execution-ledger pins below
      # decide their verdicts in scripts/exec-ledger-within-basis-v1.mjs, so a
      # ledger that measured nothing, a basis edited away from the one the lane
      # is judged at, or a `within` row the fresh reading exceeds must all leave
      # that module returning nonzero. Stubbing the reading source proves it
      # here, in seconds, without a compile.
      - name: Self-test the within-basis execution-ledger checker
        run: node --test scripts/exec-ledger-within-basis-v1.test.mjs
      - name: Run normalized Aiken auto-formatter check
        run: |
          # `aiken` here is the pinned fork — see the PATH step above. The fork
          # is the formatting authority as well as the build and check
          # authority (owner ruling A); the one repo-wide re-format at the
          # switch is what makes this step green under it.
          git ls-files -z '*.ak' | xargs -0 aiken fmt
          # The formatter emits trailing spaces for monadic let/expect syntax.
          # Normalize only that formatter artifact before comparing sources.
          git ls-files -z '*.ak' | xargs -0 sed -i 's/[[:space:]]\+$//'
          git diff --name-only --exit-code -- '*.ak'
      # One compiler now type-checks AND executes. The split that used to live
      # here (released compiler compiles, patched compiler executes) is gone
      # with stock's retirement.
      - name: Compile and run the Aiken test suite with the pinned fork
        run: aiken check
      # Issue #574. `docs/spec/midgard-tx.md` §8.10 publishes thirteen absolute
      # execution readings and nine subtractions derived from them. They were
      # hand-transcribed and nothing asserted them — a grep for any published
      # figure hit only the document — so the validator could drift arbitrarily
      # far from its own published cost with the suite still green. The step
      # above cannot catch that: `aiken check` reports execution units, it does
      # not compare them to anything, and an Aiken test cannot assert its own
      # units because the units are the report's observation of the test rather
      # than a value in scope. This is the level at which the comparison is
      # possible, so this is where it lives.
      - name: Pin the §8.10 carriage execution ledger
        env:
          MIDGARD_AIKEN_BIN: /home/runner/.aiken-fork/bin/aiken
        run: node scripts/verify-carriage-exec-ledger-v1.mjs
      # Issue #575, the Q1x family-rebind wave of #565. Same reasoning as the
      # step above, applied to the lane's own exit criterion: the Q1x steps'
      # execution costs at the 13,200,000-mem GOAL_SPEC §3.3 basis, and the
      # Q1X-F6 claim (#551) that a step's cost no longer scales with the
      # disputed transaction's spend-input count. That claim is the whole point
      # of the rebind, so it is asserted here rather than reported once and
      # trusted afterwards.
      - name: Pin the Q1x family execution ledger
        env:
          MIDGARD_AIKEN_BIN: /home/runner/.aiken-fork/bin/aiken
        run: node scripts/verify-q1x-exec-ledger-v1.mjs
      # Issue #576, the Q31 reference-input-no-idx lane. Its ledger was written
      # with a verifier and no step, so nothing ran it: the lane's exit
      # criterion existed as a file. All four ledgers in scripts/ are pinned
      # here now, on the same terms, so "which ledgers are enforced" stops being
      # a per-lane accident.
      - name: Pin the Q31 reference-input-no-idx family execution ledger
        env:
          MIDGARD_AIKEN_BIN: /home/runner/.aiken-fork/bin/aiken
        run: node scripts/verify-q31-exec-ledger-v1.mjs
      # Issue #577, the Q21 transition-trace lane of the same wave. Pinned here
      # for the reason the three steps above are, plus one specific to this
      # lane: its two rebound call sites moved in opposite directions — the
      # forced-order path got cheaper, the two-field L2 path got dearer because
      # opening two fields re-derives the transaction id twice over. A
      # regression that is understood and accepted still has to be held to the
      # number it was accepted at, and only a step that runs can do that.
      - name: Pin the Q21 transition-trace family execution ledger
        env:
          MIDGARD_AIKEN_BIN: /home/runner/.aiken-fork/bin/aiken
        run: node scripts/verify-q21-exec-ledger-v1.mjs
      # Issue #594, the §8.11 forced-order material carriage lane. §8.11
      # publishes a cost for the tx-order mint — the whole-materialising door's
      # full-preimage re-hash, "bounded by §5.4's 32,768-byte aggregate" — and
      # the mint is the only on-chain reader of an order's material, so a cost
      # claim nobody can falsify decides whether that material reaches L1 at
      # all. The ledger pins the nine-field walk at §5.4's bound and, at two
      # cardinalities, the per-item cost of the variable-width fields'
      # `walk_to_end` that the published sentence does not mention.
      - name: Pin the tx-order mint material-carriage execution ledger
        env:
          MIDGARD_AIKEN_BIN: /home/runner/.aiken-fork/bin/aiken
        run: node scripts/verify-tx-order-mint-exec-ledger-v1.mjs
      # Issue #596, the §12.7 canonical-decodability fault family. Its step 01
      # is the only adjudication of a field the operator committed to bytes that
      # are not a §5.1 envelope — the escape hatch every §8.8 view door aborts
      # on rather than rejects — so a cost claim nobody can falsify decides
      # whether that fault is provable on L1 at all, and nothing else in the
      # suite would notice if it stopped being. The ledger pins the byte term at
      # §5.4's per-field bound on §8.4's chunked route and, at two cardinalities
      # with a fixture-only control beside each, the per-item cost of the §5.1
      # walk the verdict runs.
      - name: Pin the canonical-decodability committed-preimage execution ledger
        env:
          MIDGARD_AIKEN_BIN: /home/runner/.aiken-fork/bin/aiken
        run: node scripts/verify-canonical-decodability-exec-ledger-v1.mjs
      # Issue #601, the §12.8 committed-field-shape sibling fault family. It is
      # the only adjudication of a committed preimage that IS a §5.1 envelope
      # and that its own slot still refuses — §7.4's stride arithmetic or §5.4's
      # byte bound — which are the two stalls §12.7's residue paragraph named
      # and could not close. Its dominant cost term is §12.7's §5.1 walk, reused
      # as the envelope guard, so its budget can move without anything in the
      # §12.7 lane noticing. The ledger pins the byte term at §5.4's per-field
      # bound on §8.4's chunked route and, at two cardinalities with a
      # fixture-only control beside each, the per-item cost of that walk.
      - name: Pin the committed-field-shape slot-verdict execution ledger
        env:
          MIDGARD_AIKEN_BIN: /home/runner/.aiken-fork/bin/aiken
        run: node scripts/verify-committed-field-shape-exec-ledger-v1.mjs
      # RETIREMENT RECORD — the dual-compiler blueprint-agreement guard
      # (issue #521; `scripts/verify-dual-compiler-blueprint-agreement.mjs`),
      # retired by the owner's 2026-08-13 ruling A on #579 together with the
      # stock compiler it compared against. Recorded here rather than deleted
      # silently, because the guard's FINAL reading is the reason the switch
      # happened and is the only surviving evidence of the defect class.
      #
      # Final divergence snapshot, both blueprints built from the same tree:
      #
      #   validator                      stock v1.1.22+39d6b04   fork v1.1.23+2a78108
      #   user_events/tx_order_v1.mint   81fa79f4…  9,851 bytes  b5541807…  10,071 bytes
      #
      # ONE validator diverged, and the stock side is the WRONG artifact. Stock
      # v1.1.22 keys generated expect-decoders as `__expect_{local_type_name}`
      # with no module path, so types sharing a local name across modules share
      # a single decoder and at least one of them gets a decoder that is wrong
      # in both directions. `MintRedeemer` is declared in 12 modules on this
      # tree, and #594 gave the tx-order mint its own `MintRedeemer` wrapper —
      # which is exactly where the collision lands. Upstream fixed this in
      # `cb6105cb`; the pinned fork carries that fix.
      #
      # The 2026-08-11 ruling's estimate of an "expected 8-validator delta" is
      # VOID: the measured delta is 1 validator / 2 blueprint entries.
      #
      # The guard is not replaced by another gate. With one compiler there is
      # no second opinion to compare against, so the property it protected is
      # now carried by the pin itself: the identity assertion above fails
      # closed if anything but `v1.1.23+2a78108` ever compiles this tree.
      - name: Check that aiken.lock is up-to-date
        run: git diff --name-only --exit-code aiken.lock
