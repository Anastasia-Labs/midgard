name: Aiken CI

on:
  push:
    branches: ["main"]
    paths:
      - onchain/aiken/**
  pull_request:
    paths:
      - onchain/aiken/**

env:
  # github.com/colll78/aiken, reporting v1.1.23+6d14ab2. Pinned by commit
  # rather than branch so the toolchain is reproducible. The full-suite timing
  # this pin was chosen on was taken here: `aiken check` in 735.9 s / 819 tests
  # / 0 failures on 4 vCPU, the GitHub-hosted runner size for this public repo.
  # Do not advance this pin without re-running that measurement.
  #
  # The branch tip is 2a78108c, exactly one commit ahead: `chore: satisfy
  # clippy 1.97`, whose whole diff is lint idiom across the LSP, blueprint,
  # telemetry and `tx simulate` paths plus one `Display` helper in
  # `uplc::flat` — no file under code generation or evaluation is touched.
  # Some execution-ledger rows in `onchain/aiken/scripts/` were therefore
  # *taken* on 2a78108 locally rather than on this pin, and the equivalence is
  # verified rather than only argued: the #574 §8.10 carriage ledger, pinned
  # under 6d14ab2, re-verifies to the unit under 2a78108. What has NOT been
  # re-measured on the tip is the wall-clock figure above, which is the reason
  # the pin has not moved.
  AIKEN_FORK_REV: 6d14ab2dd63633db6a7d626c4ad129d87c0f108c

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: ./onchain/aiken
    steps:
      - uses: actions/checkout@v3
      - uses: aiken-lang/setup-aiken@v1.0.3
        with:
          version: v1.1.22
      # The released v1.1.22 compiler stays the authority for `aiken fmt`,
      # `aiken build`, and every applied validator hash in release evidence.
      # It cannot, however, run the test suite: upstream aiken#1389 makes a
      # full `aiken check` take 485 minutes on this tree, against a 360-minute
      # job ceiling, so this workflow could never pass. The patched fork runs
      # the identical suite in ~10 minutes. It is used ONLY to execute tests;
      # it is pinned by commit, not branch, and cached by that commit.
      - name: Cache patched Aiken test compiler
        id: aiken-fork
        uses: actions/cache@v4
        with:
          path: ~/.aiken-fork
          key: aiken-fork-${{ env.AIKEN_FORK_REV }}-${{ runner.os }}
      - name: Build patched Aiken test compiler
        if: steps.aiken-fork.outputs.cache-hit != 'true'
        working-directory: .
        run: |
          rustup toolchain install 1.94.1 --profile minimal
          # --locked honours the fork's committed Cargo.lock; without it cargo
          # re-resolves every dependency on each cache miss, so an unrelated
          # crate release could redden this branch or silently change the
          # toolchain the measurement above was taken on.
          cargo +1.94.1 install \
            --git https://github.com/colll78/aiken \
            --rev "$AIKEN_FORK_REV" \
            --locked \
            --root ~/.aiken-fork \
            aiken
      # Assert, don't just print: a cache poisoned by an earlier rev or a
      # setup-aiken resolution drift must fail here rather than silently
      # changing which compiler produced the result.
      - name: Assert both compiler identities
        run: |
          set -euo pipefail
          released="$(aiken --version)"
          patched="$(~/.aiken-fork/bin/aiken --version)"
          printf 'released: %s\npatched:  %s\n' "$released" "$patched"
          test "$released" = "aiken v1.1.22+39d6b04"
          test "$patched" = "aiken v1.1.23+${AIKEN_FORK_REV:0:7}"
      - name: Verify generated user events witness prefix
        if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'pull_request' && github.base_ref == 'main')
        working-directory: .
        run: |
          ./scripts/generate-user-events-witness-script-prefix.sh
          git diff --name-only --exit-code onchain/aiken/env/default.ak onchain/aiken/env/testnet.ak
      # The two guard self-tests run BEFORE the formatter check, and the
      # position is deliberate. They are the gates that prove the other gates
      # can fail; they need no compiler, no cache and no toolchain, and they
      # finish in seconds. Behind the formatter check they were conditional on
      # it: every step after the first failure is `skipped`, so a formatting
      # drift in any one of the 408 tracked .ak files took the gate-can-fail
      # evidence offline along with the suite — which is exactly what had
      # happened, in nine files, when #577's round-2 review looked. Nothing is
      # weakened by the move: `aiken fmt` still runs below and still fails the
      # job, and the steps that genuinely need a compiler still sit after it.
      #
      # Issue #523. A focused `aiken check -m <selector>` whose selector matches
      # nothing prints an empty report and exits 0, so every gate citing it
      # reports success while running no tests. scripts/guard-focused-selector.mjs
      # turns that into a nonzero exit naming the selector; its self-test
      # includes the negative case, and an unguarded guard is worth nothing.
      - name: Self-test the fail-closed focused-selector guard
        run: node --test scripts/guard-focused-selector.test.mjs
      # Issue #577. Same reasoning one level up: the execution-ledger pins below
      # decide their verdicts in scripts/exec-ledger-within-basis-v1.mjs, so a
      # ledger that measured nothing, a basis edited away from the one the lane
      # is judged at, or a `within` row the fresh reading exceeds must all leave
      # that module returning nonzero. Stubbing the reading source proves it
      # here, in seconds, without a compile.
      - name: Self-test the within-basis execution-ledger checker
        run: node --test scripts/exec-ledger-within-basis-v1.test.mjs
      - name: Run normalized Aiken auto-formatter check
        run: |
          # The two formerly excluded lib files were another task's in-flight
          # checkpoint; they are integrated now, so the exclusion and its
          # protected-format-checkpoint.sha256 pin are gone and every tracked
          # .ak file is held to the same standard.
          git ls-files -z '*.ak' | xargs -0 aiken fmt
          # Aiken 1.1.22 emits trailing spaces for monadic let/expect syntax.
          # Normalize only that formatter artifact before comparing sources.
          git ls-files -z '*.ak' | xargs -0 sed -i 's/[[:space:]]\+$//'
          git diff --name-only --exit-code -- '*.ak'
      # Type/compile check with the released authority compiler, then execute
      # the suite with the patched one. Both must pass.
      - name: Compile Aiken code with the released compiler
        run: aiken check --skip-tests
      - name: Run the Aiken test suite with the patched compiler
        run: ~/.aiken-fork/bin/aiken check
      # Issue #574. `docs/spec/midgard-tx.md` §8.10 publishes thirteen absolute
      # execution readings and nine subtractions derived from them. They were
      # hand-transcribed and nothing asserted them — a grep for any published
      # figure hit only the document — so the validator could drift arbitrarily
      # far from its own published cost with the suite still green. The step
      # above cannot catch that: `aiken check` reports execution units, it does
      # not compare them to anything, and an Aiken test cannot assert its own
      # units because the units are the report's observation of the test rather
      # than a value in scope. This is the level at which the comparison is
      # possible, so this is where it lives.
      - name: Pin the §8.10 carriage execution ledger
        env:
          MIDGARD_AIKEN_BIN: /home/runner/.aiken-fork/bin/aiken
        run: node scripts/verify-carriage-exec-ledger-v1.mjs
      # Issue #575, the Q1x family-rebind wave of #565. Same reasoning as the
      # step above, applied to the lane's own exit criterion: the Q1x steps'
      # execution costs at the 13,200,000-mem GOAL_SPEC §3.3 basis, and the
      # Q1X-F6 claim (#551) that a step's cost no longer scales with the
      # disputed transaction's spend-input count. That claim is the whole point
      # of the rebind, so it is asserted here rather than reported once and
      # trusted afterwards.
      - name: Pin the Q1x family execution ledger
        env:
          MIDGARD_AIKEN_BIN: /home/runner/.aiken-fork/bin/aiken
        run: node scripts/verify-q1x-exec-ledger-v1.mjs
      # Issue #576, the Q31 reference-input-no-idx lane. Its ledger was written
      # with a verifier and no step, so nothing ran it: the lane's exit
      # criterion existed as a file. All four ledgers in scripts/ are pinned
      # here now, on the same terms, so "which ledgers are enforced" stops being
      # a per-lane accident.
      - name: Pin the Q31 reference-input-no-idx family execution ledger
        env:
          MIDGARD_AIKEN_BIN: /home/runner/.aiken-fork/bin/aiken
        run: node scripts/verify-q31-exec-ledger-v1.mjs
      # Issue #577, the Q21 transition-trace lane of the same wave. Pinned here
      # for the reason the three steps above are, plus one specific to this
      # lane: its two rebound call sites moved in opposite directions — the
      # forced-order path got cheaper, the two-field L2 path got dearer because
      # opening two fields re-derives the transaction id twice over. A
      # regression that is understood and accepted still has to be held to the
      # number it was accepted at, and only a step that runs can do that.
      - name: Pin the Q21 transition-trace family execution ledger
        env:
          MIDGARD_AIKEN_BIN: /home/runner/.aiken-fork/bin/aiken
        run: node scripts/verify-q21-exec-ledger-v1.mjs
      # Issue #594, the §8.11 forced-order material carriage lane. §8.11
      # publishes a cost for the tx-order mint — the whole-materialising door's
      # full-preimage re-hash, "bounded by §5.4's 32,768-byte aggregate" — and
      # the mint is the only on-chain reader of an order's material, so a cost
      # claim nobody can falsify decides whether that material reaches L1 at
      # all. The ledger pins the nine-field walk at §5.4's bound and, at two
      # cardinalities, the per-item cost of the variable-width fields'
      # `walk_to_end` that the published sentence does not mention.
      - name: Pin the tx-order mint material-carriage execution ledger
        env:
          MIDGARD_AIKEN_BIN: /home/runner/.aiken-fork/bin/aiken
        run: node scripts/verify-tx-order-mint-exec-ledger-v1.mjs
      # Issue #521. The released compiler keys generated expect-decoders by
      # local type name only, so two same-named types in different modules
      # share one decoder and the shipped blueprint silently gets a decoder
      # that is wrong in both directions. Neither step above can see that
      # class: `aiken check` compiles every test as its own program, so
      # colliding types never co-occur there, and the suite runs on the
      # patched compiler anyway. Building the blueprint with BOTH compilers
      # and requiring byte-identical validators is what makes it visible.
      - name: Assert both compilers agree on the blueprint
        run: |
          MIDGARD_STOCK_AIKEN_BIN=aiken \
          MIDGARD_FORK_AIKEN_BIN="$HOME/.aiken-fork/bin/aiken" \
          node scripts/verify-dual-compiler-blueprint-agreement.mjs
      - name: Check that aiken.lock is up-to-date
        run: git diff --name-only --exit-code aiken.lock
