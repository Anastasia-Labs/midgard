name: Deploy Docs Site to GitHub Pages

# Deploys one combined Pages artifact: the docs-site static export at
# /midgard/, with the compiled specification at /midgard/midgard.pdf so the
# PDF's pre-existing URL keeps working.

on:
  push:
    branches: ["main"]
    paths:
      - "docs-site/**"
      - "technical-spec/**"
      - "demo/lucid-midgard/**"
      - "demo/midgard-core/**"
      - "demo/package.json"
      - "demo/pnpm-lock.yaml"
      - "demo/.nvmrc"
      - ".github/workflows/pages-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Compile the specification PDF
        uses: xu-cheng/latex-action@e2f99d4b3685b0da93f97e1b86ad8fab81105098 # 3.3.0
        with:
          root_file: midgard.tex
          working_directory: technical-spec/

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: demo/.nvmrc

      # The demo workspace pins pnpm 9; docs-site pins pnpm 10. Install the
      # workspace deps first, so the SDK packages can be built, then switch.
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          package_json_file: demo/package.json
      - name: Install demo workspace dependencies
        run: pnpm --dir demo install --frozen-lockfile

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          package_json_file: docs-site/package.json
      - name: Install docs-site dependencies
        run: pnpm --dir docs-site install --frozen-lockfile

      # prebuild runs check:links; the build type-checks every MDX code sample
      # against the built SDK packages.
      - name: Build docs site
        run: pnpm --dir docs-site run build
        env:
          NEXT_PUBLIC_BASE_PATH: /midgard

      - name: Assemble the Pages artifact
        run: |
          cp technical-spec/midgard.pdf docs-site/out/
          touch docs-site/out/.nojekyll

      - uses: actions/configure-pages@1f0c5cde4bc74cd7e1254d0cb4de8d49e9068c7d # v4.0.0

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: docs-site/out/

      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
