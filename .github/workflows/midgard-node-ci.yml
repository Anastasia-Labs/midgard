name: Midgard Node CI

on:
  push:
    branches: ["main"]
    paths:
      - "scripts/contrib.mjs"
      - "scripts/contrib/**"
      - "scripts/pnpm.mjs"
      - "scripts/bin/**"
      - "demo/**"
      - "onchain/aiken/**"
      - "config/deployments/**"
      - "docs/consensus-profile-v1.md"
      - "docs/spec/**"
      - "scripts/ci/**"
      - "scripts/lib/worktree-identity.mjs"
      - ".github/actions/**"
      - ".github/workflows/midgard-node-ci.yml"
  pull_request:
    paths:
      - "scripts/contrib.mjs"
      - "scripts/contrib/**"
      - "scripts/pnpm.mjs"
      - "scripts/bin/**"
      - "demo/**"
      - "onchain/aiken/**"
      - "config/deployments/**"
      - "docs/consensus-profile-v1.md"
      - "docs/spec/**"
      - "scripts/ci/**"
      - "scripts/lib/worktree-identity.mjs"
      - ".github/actions/**"
      - ".github/workflows/midgard-node-ci.yml"
  workflow_dispatch:

# A newer push to the same pull request supersedes the running one; pushes to
# main always run to completion.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

# THE COMPILER PIN. Issue #579, rider 1, and the owner's 2026-08-13 ruling A:
# the patched fork is the SOLE compiler, and it is what defines deployed script
# identity. Stock v1.1.22 is retired from every role and is no longer installed
# by this workflow.
#
# The jobs below are not bystanders to that ruling. The `blueprint` job's
# `aiken build --env testnet` produces the testnet blueprint the node, SDK,
# validation and fault-proof suites resolve script hashes from, so the compiler
# chosen here is the compiler whose identity those suites assert; and the
# golden-vector channels shell out to `aiken fmt` through
# `demo/midgard-core/scripts/golden-channel.mjs` — in `--check` mode as well as
# `:sync` — so it is also the formatting authority whose output those
# cross-language claims are compared against.
# Under stock v1.1.22 both were measured against the wrong artifact: stock keys
# generated expect-decoders by LOCAL type name with no module path (issue
# #521), so two same-named types in different modules share one decoder, and
# the retirement snapshot recorded in `aiken-ci.yml` measured the consequence
# on this tree — `user_events/tx_order_v1.mint` diverges (stock 81fa79f4…,
# 9,851 bytes; fork b5541807…, 10,071 bytes).
#
# All four arms of rider 1's pin, so a reviewer on other hardware can reproduce
# the toolchain rather than take it on trust:
#   repo    https://github.com/Anastasia-Labs/aiken   (org-controlled)
#   tag     midgard-5adf7837                          (annotated, immutable)
#   commit  5adf7837cbddb5d329fd51d9c0cd73f561eaf95c
#   md5     ea9b39054f166e94771f838a662712f7          (published in the tag
#                                                      message, so it is fixed
#                                                      once for everyone)
# The version string `v1.1.23+5adf783` is derived from the commit at build
# time, so it is the arm that reproduces from source anywhere; the md5 is the
# tagging build's own artifact hash and is pinned as provenance, not as a
# build-time equality check (two honest builds of one tag on two machines need
# not agree byte for byte).
#
# The 2026-08-27 advance from midgard-2a78108c to midgard-5adf7837, and the
# measured blueprint/exunit invariance that makes it a pin bump rather than a
# re-derivation, are recorded once in `.github/workflows/aiken-ci.yml`.
# `onchain/aiken/scripts/pinned-compiler.mjs` fails if the two workflows ever
# disagree on any of these values.
#
# JOB LAYOUT. Every independent gate is its own job, so the first red no longer
# hides the rest: the fork is built once and shared as an artifact, the
# blueprint is built once from it and shared together with its build record,
# and each package job starts from the workspace state its checks had in the
# old serial job (`prebuild` rebuilds the packages that were built before them
# there). The `gate` job at the bottom is the one check branch protection
# should require; `scripts/ci/lint-workflows.mjs` holds it to the fail-closed
# shape.
env:
  AIKEN_FORK_REPO: https://github.com/Anastasia-Labs/aiken
  AIKEN_FORK_TAG: midgard-5adf7837
  AIKEN_FORK_REV: 5adf7837cbddb5d329fd51d9c0cd73f561eaf95c
  AIKEN_FORK_VERSION: aiken v1.1.23+5adf783
  AIKEN_FORK_BINARY_MD5: ea9b39054f166e94771f838a662712f7
  L1_PROVIDER: Kupmios
  L1_BLOCKFROST_API_URL: https://blockfrost.invalid
  L1_BLOCKFROST_KEY: test-key
  L1_OGMIOS_KEY: http://127.0.0.1:1337
  L1_KUPO_KEY: http://127.0.0.1:1442
  L1_OPERATOR_SEED_PHRASE: "panther fly crawl express smile lend company blue slogan dawn wall tip angle tomorrow battle myth category vanish misery ocean include salon wood rail"
  L1_OPERATOR_SEED_PHRASE_FOR_MERGE_TX: "second salad helmet humble left noise inform person swamp surround twice animal fitness sing laundry saddle stove guess cabin rural kidney reject oil fee"
  NETWORK: Preprod
  RUN_GENESIS_ON_STARTUP: "false"
  POSTGRES_HOST: 127.0.0.1
  POSTGRES_PORT: 5432
  POSTGRES_USER: postgres
  POSTGRES_PASSWORD: postgres
  POSTGRES_DB: midgard
  TESTNET_GENESIS_WALLET_SEED_PHRASE_A: "panther fly crawl express smile lend company blue slogan dawn wall tip angle tomorrow battle myth category vanish misery ocean include salon wood rail"
  TESTNET_GENESIS_WALLET_SEED_PHRASE_B: "second salad helmet humble left noise inform person swamp surround twice animal fitness sing laundry saddle stove guess cabin rural kidney reject oil fee"
  TESTNET_GENESIS_WALLET_SEED_PHRASE_C: "cactus chalk grit reopen true slight whale sand law sibling silver fringe cement twist process bracket history leopard churn federal coral three hockey fossil"

jobs:
  aiken-fork:
    name: Pinned Aiken fork
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # No `setup-aiken` step: the fork is the compiler here for the reason
      # given at the top of this file, and it is built by the same script and
      # cached under the same path and key shape as in `aiken-ci`, so the
      # blueprint this run builds cannot come from a different compiler than
      # the one that workflow judges.
      - name: Cache the pinned Aiken fork
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.aiken-fork
          key: aiken-fork-${{ env.AIKEN_FORK_REV }}-${{ runner.os }}
      # A restored cache that already reports the pin is left alone; anything
      # else is rebuilt with `cargo install --locked` from the pinned rev.
      - name: Build the pinned Aiken fork
        run: scripts/ci/build-aiken-fork.sh --prefix ~/.aiken-fork
      # Assert, don't just print: a cache poisoned by an earlier rev must fail
      # here rather than silently changing which compiler produced the testnet
      # blueprint the suites assert hashes against.
      - name: Assert the pinned compiler identity
        run: node onchain/aiken/scripts/pinned-compiler.mjs ~/.aiken-fork/bin/aiken
      - name: Share the pinned Aiken fork with later jobs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: aiken-fork
          path: ~/.aiken-fork/bin/aiken
          if-no-files-found: error
          retention-days: 3

  blueprint:
    name: Testnet blueprint
    needs: [aiken-fork]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/demo-setup
        with:
          aiken: "true"
          install-filter: midgard-demo
      # Writes plutus.json and its build record plutus.json.deployment.json.
      # Suites that read the blueprint refuse one without a fresh record, so
      # both travel together; never replace this with a bare `aiken build`.
      - name: Build testnet Aiken blueprint
        run: pnpm --dir demo deployment:build preprod-testing
      - name: Share the blueprint and its build record with later jobs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: testnet-blueprint
          path: |
            onchain/aiken/plutus.json
            onchain/aiken/plutus.json.deployment.json
          if-no-files-found: error
          retention-days: 3

  # The blueprints only test runs read, built here once rather than in every
  # shard that reads them: the interactive-emulator one that the fault-proof
  # and watcher suites' interactive project stamps for itself, and the two
  # verbose-traced ones the traced-refusal step swaps modules out of. Each is
  # built by the same code the suites would otherwise run, with its build
  # record beside it. The consumers set MIDGARD_REQUIRE_PREBUILT_BLUEPRINTS,
  # so a copy whose record no longer matches the checkout, the profile or the
  # pinned compiler fails the run rather than being rebuilt in place. The two
  # traced builds run only when the traced-refusal step below will read them:
  # on a pull request that touches one of that check's inputs
  # (scripts/ci/traced-refusal-inputs.mjs lists them), and on every other
  # event. Otherwise their steps are skipped and the job still succeeds.
  test-blueprints:
    name: Test blueprint (${{ matrix.blueprint }})
    needs: [aiken-fork]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - blueprint: interactive-emulator
            build: node demo/midgard-test-support/interactive-emulator.js
            directory: onchain/aiken/build/interactive-emulator
            record: plutus.json.deployment.json
            traced: false
          - blueprint: traced-preprod-testing
            build: node demo/midgard-fault-proofs/scripts/traced-blueprint.mjs preprod-testing
            directory: onchain/aiken/build/traced-refusals/preprod-testing
            record: traced-build.json
            traced: true
          - blueprint: traced-preprod-emulator-testing
            build: node demo/midgard-fault-proofs/scripts/traced-blueprint.mjs preprod-emulator-testing
            directory: onchain/aiken/build/traced-refusals/preprod-emulator-testing
            record: traced-build.json
            traced: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # The pull request merge commit and its base parent, for the diff.
          fetch-depth: 2
      - name: Decide whether this change can alter a traced refusal
        id: traced
        if: matrix.traced
        run: node scripts/ci/traced-refusal-inputs.mjs
      - uses: ./.github/actions/demo-setup
        if: ${{ !matrix.traced || steps.traced.outputs.run == 'true' }}
        with:
          aiken: "true"
          install-filter: midgard-demo
      - name: Build the ${{ matrix.blueprint }} blueprint
        if: ${{ !matrix.traced || steps.traced.outputs.run == 'true' }}
        run: ${{ matrix.build }}
      - name: Share the blueprint and its build record with later jobs
        if: ${{ !matrix.traced || steps.traced.outputs.run == 'true' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: test-blueprint-${{ matrix.blueprint }}
          path: |
            ${{ matrix.directory }}/plutus.json
            ${{ matrix.directory }}/${{ matrix.record }}
          if-no-files-found: error
          retention-days: 3

  # The launch surface. Every compose stack an operator can be told to run
  # must render from `.env.example` alone, and the node image must build from
  # a fresh checkout plus the blueprint the `blueprint` job produced; none of
  # that was exercised by CI before, so a gitignored COPY source or a mistyped
  # overlay reached operators first.
  compose-render:
    name: Operator compose stacks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Render every operator compose stack from .env.example
        working-directory: demo/midgard-node
        run: |
          set -euo pipefail
          # The stacks require an operator .env beside them (env_file); a
          # fresh checkout has none, so stand .env.example in for it.
          cp .env.example .env
          render() {
            docker compose --env-file .env.example "$@" config --quiet
            # Locally built services render as bare project-prefixed names;
            # every pulled image must carry a tag other than latest.
            images="$(docker compose --env-file .env.example "$@" config --images | grep -v '^midgard-node-')"
            if grep -E ':latest$|^[^:@]+$' <<<"$images"; then
              echo "unpinned image in: $*" >&2
              exit 1
            fi
          }
          render -f docker-compose.yaml
          render -f docker-compose.yaml -f docker-compose.kupmios.yaml
          render -f docker-compose.dev.yaml
          render -f docker-compose.yaml -f docker-compose.kupmios.yaml -f docker-compose.benchmark.yaml \
            --profile observability --profile load-generator-cohosted
          render -f docker-compose.yaml --profile test
      # The main checkout must keep today's project name, container names and
      # host ports; a linked worktree must get its own. Renders the real files.
      - name: Test the operator compose worktree derivation
        if: ${{ !cancelled() }}
        run: node --test demo/midgard-node/scripts/operator-compose.test.mjs
      - name: Render the phase4 devnet compose
        if: ${{ !cancelled() }}
        working-directory: demo/midgard-node-tools/devnet/phase4-process
        env:
          MIDGARD_PHASE4_COMPOSE_PROJECT: ci
          MIDGARD_PHASE4_POSTGRES_DATABASE: midgard_phase4
          MIDGARD_PHASE4_POSTGRES_PASSWORD: ci
          MIDGARD_PHASE4_RUN_DIR: ${{ runner.temp }}/phase4
        run: docker compose -f compose.yaml config --quiet

  node-image:
    name: Node image
    needs: [aiken-fork, blueprint]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Download the testnet blueprint and its build record
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: testnet-blueprint
          path: onchain/aiken
      - name: Build the node image
        working-directory: demo
        run: |
          set -euo pipefail
          docker build --file midgard-node/Dockerfile \
            --build-context onchain=../onchain/aiken \
            --tag midgard-node:ci .
          docker run --rm midgard-node:ci node ./dist/index.js --help >/dev/null

  # Every cross-language golden channel, one step each. Each generator
  # regenerates its artifacts from the TypeScript twins in `--check` mode and
  # fails on any difference, so a hand-edited vector, or an edited producer
  # plus a `:sync`, cannot re-green both language suites unnoticed
  # (#519/#523). Each step runs even when an earlier one failed, so one stale
  # channel no longer hides the state of the others.
  golden-channels:
    name: Golden channels
    needs: [aiken-fork, blueprint]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/demo-setup
        with:
          blueprint: "true"
          prebuild: lucid-midgard midgard-core midgard-sdk
      - name: Check canonical V1 profile documentation
        if: ${{ !cancelled() }}
        run: pnpm --dir demo/midgard-core run docs:consensus-profile-v1:check
      # Both artifacts of the native-V1 field-access golden channel — the JSON
      # fixture and the generated Aiken module — are regenerated from the
      # TypeScript twin, never hand-edited. Without this gate an edited
      # `native-tx-field-access-v1-golden.test.ak` passes the Aiken suite and
      # the vitest suite while no longer being what the twin produces, which is
      # exactly the cross-language drift the channel exists to catch. The step
      # runs `aiken fmt` on a temp file, so it needs the pinned fork on PATH.
      - name: Check native V1 field-access golden vectors
        if: ${{ !cancelled() }}
        run: pnpm --dir demo/midgard-core run fixtures:native-tx-field-access-v1:check
      # The per-field half of the same channel (#569): for every field index
      # 0..8, what §5.3's `enc_i` actually is. It gates on the identical
      # footing and for the identical reason — the JSON fixture and the
      # generated Aiken module are produced from the TypeScript twins and are
      # never hand-edited, so without this step a hand-edited vector passes
      # both language suites while no longer being what the producers emit.
      - name: Check native V1 per-field item golden vectors
        if: ${{ !cancelled() }}
        run: pnpm --dir demo/midgard-core run fixtures:native-tx-field-items-v1:check
      # The §8.6/§8.8 **wire** channel (#574). It lives in the SDK rather than
      # midgard-core because what it pins is Plutus Data encoding and the
      # producer of that is `Data.to` against the SDK schemas, but it gates on
      # exactly the footing of the two above, and it needs the gate more than
      # either: one generator run emits both the JSON fixture and the generated
      # Aiken module, so an edited producer plus a `:sync` re-greens the vitest
      # suite and the Aiken suite in the same stroke. Without this step the
      # cross-language claim is unfalsifiable.
      - name: Check native V1 carriage wire golden vectors
        if: ${{ !cancelled() }}
        run: pnpm --dir demo/midgard-sdk run fixtures:native-tx-carriage-wire-v1:check
      # The `n01`-`n09` transaction vectors (#588). Same footing as the three
      # channels above, with one difference worth naming: the eleven Aiken
      # constants this gates live inside a hand-written 1,700-line test module, so
      # the generator rebinds them in place rather than emitting the module. That
      # makes the gate more load-bearing, not less — nothing about the module's
      # appearance reveals which of its constants are generated.
      - name: Check native V1 n01-n09 transaction vectors
        if: ${{ !cancelled() }}
        run: pnpm --dir demo/midgard-core run fixtures:native-tx-vector-v1:check
      # The MPF node encoding (leaf and branch node preimages disjoint), taken
      # from the MPF library alone. The vitest suites in midgard-core and
      # midgard-node and the generated Aiken module recompute it; this step keeps
      # both artifacts what the library produces.
      - name: Check MPF node-encoding golden vectors
        if: ${{ !cancelled() }}
        run: pnpm --dir demo/midgard-core run fixtures:mpf-node-encoding-v1:check
      # The §12.7 canonical-decodability channel (#596). It emits both artifacts
      # from one generator run on exactly the footing of the four above, and it
      # was left unwired when it landed — so an edited producer plus a `:sync`
      # re-greened the vitest suite and the Aiken suite in the same stroke with
      # nothing to notice. Wired here by #601 rather than left for #579, because
      # a golden channel no step runs is a gate that cannot fail (#519/#523).
      - name: Check canonical-decodability golden vectors
        if: ${{ !cancelled() }}
        run: pnpm --dir demo/midgard-sdk run fixtures:canonical-decodability-v1:check
      # The §12.8 committed-field-shape channel (#601). Same footing as the five
      # above, with the difference that makes it matter more: its verdict takes
      # **two** arguments, so a twin that transposed the slot or read §5.3's
      # stride table one row differently would agree with its partner on most
      # inputs and disagree on exactly the ones the fault kind exists for. The
      # generator also enforces the partition against §12.7 — no vector may be
      # convicted by both fault kinds — and that check only runs here.
      - name: Check committed-field-shape golden vectors
        if: ${{ !cancelled() }}
        run: pnpm --dir demo/midgard-sdk run fixtures:committed-field-shape-v1:check
      # Off-chain code must serialise a DA commitment to the same bytes as the
      # validators, or a node could attest a commitment that no challenger can
      # open against. These vectors pin the on-chain encoding, commitment_hash_v1,
      # the attestation message and the challenge record at 1, 16 and 64 tranches.
      # This step compares only the fixture with the generator's own encoder and
      # the Aiken module. The SDK side is demo/midgard-sdk/tests/da-golden-vectors.test.ts,
      # which the midgard-sdk job's test step runs.
      - name: Check DA commitment golden vectors
        if: ${{ !cancelled() }}
        run: pnpm --dir demo/midgard-sdk run fixtures:da-commitment-v1:check
      # The pooled DA bond datum decides whether an Apply may attest and when a
      # withdrawal may complete, the spend redeemer's constructor picks the pool
      # transition, and ParametersV1 is applied to the attestation, pool and
      # availability scripts. These vectors pin their on-chain encoding, and all
      # four StateQueueStatusV1 arms, against the Aiken types.
      - name: Check DA bond pool golden vectors
        if: ${{ !cancelled() }}
        run: pnpm --dir demo/midgard-sdk run fixtures:da-bond-pool-v1:check
      # The 256 capacity-test signatures sign attestation_message_v1 of the
      # fixture commitment, so any change to the fixture or to CommitmentV1 must
      # come with signatures regenerated by the generator, never by hand.
      - name: Check DA attestation capacity signatures
        if: ${{ !cancelled() }}
        run: pnpm --dir demo/midgard-sdk run fixtures:da-attestation-capacity-v1:check
      # The C20-6, C20-7 and field-8 maximum constant families in
      # `native-tx-v1.test.ak` and `native-tx.max-redeemers.test.ak` are produced by
      # the three ordered-collection boundary suites, which is why this gate runs
      # them again rather than recomputing anything: the genuine signed-Cardano
      # boundary is only findable under vitest. Without it, those constants are
      # hand-mirrored twins again the moment the boundary moves (#588).
      - name: Check ordered-collection boundary Aiken constants
        if: ${{ !cancelled() }}
        run: pnpm --dir demo/midgard-validation run fixtures:ordered-collection-boundary-aiken:check
      # The three nested-maximum families — the balanced constructor/list/map
      # datum, the nested redeemer `Data` and the exact 5,000-byte `Value` — on
      # the same footing. Their Aiken terminals used to be retyped out of a
      # `MIDGARD_PRINT_AIKEN_VECTOR=1` terminal dump, and that same variable
      # switched off the suites' own terminal comparison, so the one command
      # that refreshed the on-chain constants also removed the oracle that made
      # them trustworthy. The suites now assert unconditionally and publish on
      # the machine channel; this job is what makes a stale on-chain terminal a
      # red build rather than a silent cross-language drift.
      - name: Check nested boundary Aiken constants
        if: ${{ !cancelled() }}
        run: pnpm --dir demo/midgard-validation run fixtures:nested-boundary-aiken:check
      # The V1 CEK core-step channel. Before it the Aiken CEK and the TypeScript
      # CEK were pinned against each other by seventeen integer tags and one
      # hand-pasted CBOR vector; nothing proved that a step the TypeScript trace
      # builder emits is a step `verify_core_step_v1` accepts. The generator
      # compiles the curated programs, emits every step's `CoreStepEvidenceV1`
      # CBOR and state hashes plus per-program negative twists, and writes both
      # the JSON fixture and the generated Aiken module. Same footing as the
      # channels above: both artifacts are regenerated from the TypeScript twins
      # and never hand-edited, so without this step an edited producer plus a
      # `:sync` re-greens both language suites unnoticed.
      - name: Check V1 CEK core-step golden vectors
        if: ${{ !cancelled() }}
        run: pnpm --dir demo/midgard-validation run fixtures:cek-core-step-v1:check
      # The V1 CEK builtin channel: every builtin tag evaluated by the pinned
      # Aiken evaluator, values and failures, with the cases where the ledger
      # and that evaluator differ recorded as overrides beside both outcomes.
      # The node's builtin evaluation must reproduce every expected outcome.
      - name: Check V1 CEK builtin golden vectors
        if: ${{ !cancelled() }}
        run: pnpm --dir demo/midgard-validation run fixtures:cek-builtin-cardano-v1:check
      # The V1 validation-auxiliary-witness ABI channel. Its generator emits
      # both `tests/fixtures/validation-auxiliary-witness-v1.generated.json` —
      # which `demo/midgard-sdk/tests/validation-auxiliary-witness.test.ts`
      # decodes with the SDK's second implementation of the same ABI — and the
      # on-chain `validation-auxiliary-witness-v1-abi-generated.ak` that pins
      # the corpus hash and per-tag arities. It supported `--check` but no job
      # ran it, so an edited encoder plus a re-run of the generator re-greened
      # both language suites with nothing to notice (#519/#523).
      - name: Check validation-auxiliary-witness ABI golden vectors
        if: ${{ !cancelled() }}
        run: pnpm --dir demo/midgard-validation run fixtures:validation-auxiliary-witness-v1:check
      # The transition-trace ABI golden channel. The midgard-node job's test
      # step already holds tests/fixtures/transition-trace-abi.json against the
      # SDK encoder, and `aiken check` decodes every one of those fixtures into
      # its on-chain type and re-serialises it byte for byte
      # (onchain/aiken/validators/fraud-proofs/transition-trace/abi-v1-golden.test.ak).
      # This step closes the loop between the two by proving the generated Aiken
      # golden still carries exactly the bytes the JSON golden holds, so neither
      # side can be updated alone. It is a pure file transform: no build, no
      # database.
      - name: Check transition-trace ABI golden vectors
        if: ${{ !cancelled() }}
        run: pnpm --dir demo/midgard-node run fixtures:transition-trace-abi:check

  lucid-midgard:
    name: lucid-midgard
    needs: [aiken-fork, blueprint]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/demo-setup
        with:
          blueprint: "true"
          prebuild: midgard-core midgard-sdk midgard-validation midgard-fault-proofs midgard-watcher
      - name: Build lucid-midgard
        run: pnpm --dir demo/lucid-midgard run build
      - name: Typecheck lucid-midgard
        if: ${{ !cancelled() }}
        run: pnpm --dir demo/lucid-midgard run typecheck
      - name: Test lucid-midgard
        if: ${{ !cancelled() }}
        run: pnpm --dir demo/lucid-midgard test

  midgard-core:
    name: midgard-core
    needs: [aiken-fork, blueprint]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/demo-setup
        with:
          blueprint: "true"
          prebuild: lucid-midgard
      - name: Build and test Midgard core DA transport
        run: pnpm --dir demo/midgard-core run build && pnpm --dir demo/midgard-core test
      # Repository tool tests skip this file where the demo packages are not
      # installed; here the flag turns that skip into a failure.
      - name: Check build freshness against real core and validation builds
        env:
          MIDGARD_REQUIRE_REAL_BUILDS: "1"
        run: node --test scripts/contrib/build-freshness.test.mjs

  midgard-sdk:
    name: midgard-sdk
    needs: [aiken-fork, blueprint]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/demo-setup
        with:
          blueprint: "true"
          prebuild: lucid-midgard midgard-core
      - name: Build, typecheck, and test Midgard SDK
        run: pnpm --dir demo/midgard-sdk run build && pnpm --dir demo/midgard-sdk run typecheck && pnpm --dir demo/midgard-sdk test
      # The HeaderV1 ABI pin. `sdk-aiken-schema-parity` compares SDK schemas to
      # blueprint definitions structurally but normalizes titles away, so field
      # *names* and their order are not covered there. This gate is the only one
      # that holds the 25 ordered Header field names, their SDK spellings and the
      # three field groups against BOTH real projections — the blueprint the
      # compiler just generated and the Data schema the SDK build above exports.
      # It runs after the SDK build because it imports that dist. The self-test
      # follows it because a gate nothing can redden is not a gate (#519/#523):
      # it seeds fourteen hostile mutations into one input at a time and requires
      # each to be rejected, bracketed by clean control runs.
      - name: Verify HeaderV1 ABI against the blueprint and the built SDK
        if: ${{ !cancelled() }}
        run: node demo/scripts/verify-canonical-v1-header-v1-abi.mjs && node --test demo/scripts/verify-canonical-v1-header-v1-abi.test.mjs && node demo/scripts/verify-canonical-v1-header-v1-abi-self-test.mjs

  midgard-validation:
    name: midgard-validation
    needs: [aiken-fork, blueprint]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/demo-setup
        with:
          blueprint: "true"
          prebuild: lucid-midgard midgard-core midgard-sdk
      - name: Build, typecheck, and test Midgard validation
        run: pnpm --dir demo/midgard-validation run build && pnpm --dir demo/midgard-validation run typecheck && pnpm --dir demo/midgard-validation test

  # The fault-proof package's build, typecheck and plain-node script tests,
  # once per run. The test shards below resolve every workspace package from
  # source through the `midgard-source` condition and read no dist, so they
  # neither prebuild nor repeat this work.
  midgard-fault-proofs-build:
    name: midgard-fault-proofs build and typecheck
    needs: [aiken-fork, blueprint]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/demo-setup
        with:
          blueprint: "true"
          prebuild: lucid-midgard midgard-core midgard-sdk midgard-validation
      - name: Build fault-proof tooling
        run: pnpm --dir demo/midgard-fault-proofs run build
      - name: Typecheck fault-proof tooling
        if: ${{ !cancelled() }}
        run: pnpm --dir demo/midgard-fault-proofs run typecheck
      - name: Test the fit-ledger regeneration script
        if: ${{ !cancelled() }}
        run: node --test demo/midgard-fault-proofs/scripts/regenerate-fit-ledger.test.mjs

  # Six shards keep each job under 20 minutes. The suite is ~7,500 fork-seconds
  # on two forks (the five-run median per file in the package's
  # tests/support/ci-file-durations.json), each job adds a few minutes of setup
  # and Vitest overhead, and shard 1 also runs the ~300 s traced-refusal step,
  # which that table reserves. At the median each shard projects ~675 s (~17.3
  # min jobs, measured with a build and typecheck on every shard); three
  # shards projected ~28.5 min, five ~19.5. Change the count here, in the test-durations job below and in
  # tests/duration-shards.test.ts together, and rekey the table's reserve. On
  # a pull request that skips the traced-refusal step, shard 1 finishes that
  # much earlier.
  midgard-fault-proofs:
    name: midgard-fault-proofs (${{ matrix.shard }}/6)
    needs: [aiken-fork, blueprint, test-blueprints]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    # Bound evaluator parallelism on the standard hosted runner.
    env:
      MIDGARD_FAULT_PROOF_FORKS: "2"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # The pull request merge commit and its base parent, for the diff.
          fetch-depth: 2
      # Only shard 1 runs the traced-refusal step, and only when this change
      # touches one of its inputs (any event but a pull request always runs
      # it). The test-blueprints job makes the same decision from the same
      # merge commit to build the traced blueprints this step restores.
      - name: Decide whether this change can alter a traced refusal
        id: traced
        if: matrix.shard == 1
        run: node scripts/ci/traced-refusal-inputs.mjs
      - uses: ./.github/actions/demo-setup
        with:
          blueprint: "true"
          interactive-blueprint: "true"
          traced-blueprints: ${{ steps.traced.outputs.run == 'true' }}
      # The test run records each file's seconds (durationShards in
      # midgard-test-support); `test-durations` merges the shards' records into
      # the refreshed shard table. Step-scoped so the traced-refusal rerun below
      # never overwrites it.
      - name: Test fault-proof tooling
        env:
          MIDGARD_FILE_DURATIONS_OUT: ${{ runner.temp }}/file-durations.json
        run: pnpm --dir demo/midgard-fault-proofs run test --shard=${{ matrix.shard }}/6
      - name: Upload this shard's per-file test seconds
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: file-durations-midgard-fault-proofs-${{ matrix.shard }}
          path: ${{ runner.temp }}/file-durations.json
          if-no-files-found: warn
      # A plain build carries no traces, so the run above sees only that some
      # validator refused each pinned negative. This one swaps every validator
      # a pin names for its verbose-traced build and fails unless each pin is
      # checked against the trace of the check it names.
      - name: Check pinned emulator refusals against traced validators
        if: ${{ !cancelled() && steps.traced.outputs.run == 'true' }}
        run: pnpm --dir demo/midgard-fault-proofs run test:traced-refusals

  # The watcher's typecheck and format check, once per run rather than on
  # every shard below. The typecheck resolves workspace packages from source
  # and needs no dist. Its eslint pass is the workspace-wide one in the
  # `lint` job.
  midgard-watcher-typecheck:
    name: midgard-watcher typecheck and format-check
    needs: [aiken-fork, blueprint]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/demo-setup
        with:
          blueprint: "true"
      - name: Typecheck Midgard watcher
        run: pnpm --dir demo/midgard-watcher run typecheck
      - name: Format-check Midgard watcher
        if: ${{ !cancelled() }}
        run: pnpm --dir demo/midgard-watcher run format-check

  # The watcher suite. The Go helper's own tests, compose stack and image are
  # covered by midgard-watcher-ci.yml. The helper is compiled here because the
  # watcher suite drives the built binary through its TypeScript owner.
  # Every test file runs in its own fork and re-imports the SDK and validation
  # graph, so on a two-fork hosted runner wall time grows with the file count.
  # Sharded like fault-proofs once ~210 files outgrew one 45-minute job.
  midgard-watcher:
    name: midgard-watcher (${{ matrix.shard }}/3)
    needs: [aiken-fork, blueprint, test-blueprints]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: "1.26.0"
          cache-dependency-path: demo/midgard-watcher/native-chain-sync/go.sum
      - uses: ./.github/actions/demo-setup
        with:
          blueprint: "true"
          interactive-blueprint: "true"
      - name: Build the native chain-sync helper the watcher suite drives
        run: pnpm --dir demo/midgard-watcher run native:build:contrib-raw
      # Vitest loads every workspace package from source, but
      # tests/runtime/authority-initialization-command.test.ts runs the built
      # CLI (dist/cli.js) in a plain Node child, which imports the built core,
      # SDK, validation and fault-proof packages. The guarded build builds
      # that closure first.
      - name: Build the watcher CLI the suite runs
        run: pnpm --dir demo/midgard-watcher run build
      # The test run records each file's seconds (durationShards in
      # midgard-test-support); `test-durations` merges the shards' records into
      # the refreshed shard table.
      - name: Test Midgard watcher
        env:
          MIDGARD_FILE_DURATIONS_OUT: ${{ runner.temp }}/file-durations.json
        run: pnpm --dir demo/midgard-watcher run test --shard=${{ matrix.shard }}/3
      - name: Upload this shard's per-file test seconds
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: file-durations-midgard-watcher-${{ matrix.shard }}
          path: ${{ runner.temp }}/file-durations.json
          if-no-files-found: warn

  # Keeps the duration tables the fault-proof, watcher and node shards pack by
  # current. It merges the per-file seconds every shard above recorded into a
  # refreshed table per package (artifact `ci-file-durations`; commit it to
  # rebalance), prints the projected seconds of each shard under it, and warns
  # -- never fails -- when files the committed table does not know, or weighs
  # far from this run, carry more than a tenth of the run's seconds. A stale
  # table only costs balance: every file still runs in exactly one shard.
  test-durations:
    name: Refresh the CI shard duration tables
    if: ${{ !cancelled() }}
    needs: [midgard-fault-proofs, midgard-watcher, midgard-node]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          sparse-checkout: |
            demo/.nvmrc
            demo/midgard-test-support
            demo/midgard-fault-proofs/tests
            demo/midgard-watcher/tests
            demo/midgard-node/tests
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: demo/.nvmrc
      - name: Download every shard's per-file test seconds
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: file-durations-*
          path: ${{ runner.temp }}/file-durations
      - name: Merge them into refreshed tables and check the committed ones for drift
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ci-file-durations"
          # `-[0-9]*`: one package's name may prefix another's (midgard-node,
          # midgard-node-tools), so match only the shard-numbered artifacts.
          # Each package is paired with the shard count its job runs.
          for entry in midgard-fault-proofs:6 midgard-watcher:3 midgard-node:3; do
            package="${entry%%:*}"
            shards="${entry##*:}"
            records=("$RUNNER_TEMP"/file-durations/file-durations-"$package"-[0-9]*/file-durations.json)
            if [ ! -e "${records[0]}" ]; then
              echo "::warning::no per-file test seconds were recorded for $package"
              continue
            fi
            mkdir -p "$RUNNER_TEMP/ci-file-durations/demo/$package/tests/support"
            node demo/midgard-test-support/scripts/ci-file-durations.mjs \
              --package "demo/$package" \
              --table "demo/$package/tests/support/ci-file-durations.json" \
              --out "$RUNNER_TEMP/ci-file-durations/demo/$package/tests/support/ci-file-durations.json" \
              --project-shards "$shards" \
              "${records[@]}"
          done
      - name: Upload the refreshed tables
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ci-file-durations
          path: ${{ runner.temp }}/ci-file-durations
          if-no-files-found: warn

  # The native MPF owner crate, and the offline throughput gates that followed
  # it in the old serial job. The gates are pure `node --test` suites, so they
  # run whether or not the crate builds.
  native-mpf:
    name: Native MPF owner and throughput gates
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # The candidate-input gate imports lucid-midgard's dist.
      - uses: ./.github/actions/demo-setup
        with:
          prebuild: lucid-midgard
      - name: Install native MPF Rust toolchain
        run: rustup toolchain install 1.91.0 --profile minimal --component rustfmt
      - name: Cache the native MPF cargo build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: demo/midgard-node/native/mpf-event-flat-wasm
      - name: Check and build native MPF owner
        env:
          RUSTUP_TOOLCHAIN: 1.91.0
        run: |
          pnpm --dir demo/midgard-node run native:mpf-owner:check
          pnpm --dir demo/midgard-node run native:mpf-owner:build
      - name: Verify offline throughput gates
        if: ${{ !cancelled() }}
        run: |
          pnpm --dir demo/midgard-node run test:mpf:architecture-g-corpus
          pnpm --dir demo/midgard-node run test:mpf:architecture-g-gate-config
          pnpm --dir demo/midgard-node run test:mpf:architecture-g-soak
          pnpm --dir demo/midgard-node run test:mpf:architecture-g-closure
          node --test demo/midgard-node/scripts/throughput-load-watchdog.test.mjs

  # Workspace-wide eslint (type-aware) and prettier, once for every package.
  # The pre-commit hook applies the same two tools to staged files; this job is
  # the enforcement the hook cannot provide for contributors who never
  # installed it.
  lint:
    name: Lint and format
    needs: [aiken-fork, blueprint]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/demo-setup
        with:
          blueprint: "true"
          prebuild: lucid-midgard midgard-core midgard-sdk midgard-validation midgard-fault-proofs midgard-watcher midgard-node
      - name: Lint the demo workspace
        run: pnpm --dir demo run lint
      - name: Format-check the demo workspace
        if: ${{ !cancelled() }}
        run: pnpm --dir demo run format-check

  da-committee-node:
    name: da-committee-node
    needs: [aiken-fork, blueprint]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: midgard
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d midgard"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/demo-setup
        with:
          blueprint: "true"
          prebuild: lucid-midgard midgard-core midgard-sdk midgard-validation midgard-fault-proofs
      - name: Verify DA committee transport and admission
        run: pnpm --dir demo/da-committee-node run guard:no-http-da-transport && pnpm --dir demo/da-committee-node run typecheck && pnpm --dir demo/da-committee-node test

  # The node's typecheck, once per run and alongside the test shards rather
  # than on one of them, where it would add about a minute to that shard's
  # wall time. It resolves workspace packages from source and needs no dist.
  midgard-node-typecheck:
    name: midgard-node typecheck
    needs: [aiken-fork, blueprint]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/demo-setup
        with:
          blueprint: "true"
      - name: Typecheck Midgard node
        run: pnpm --dir demo/midgard-node run typecheck

  # Sharded like fault-proofs and watcher once ~450 files made one job take
  # 53.5 minutes (Node CI run 37448078028: 38 minutes of Vitest on four forks).
  # Every shard is its own job with its own Postgres service and runs the
  # isolated migration itself, so the per-worker database shards the suite
  # pins (tests/test-env.ts) never span two shards.
  midgard-node:
    name: midgard-node (${{ matrix.shard }}/3)
    needs: [aiken-fork, blueprint]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: midgard
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d midgard"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/demo-setup
        with:
          blueprint: "true"
          prebuild: lucid-midgard midgard-core midgard-sdk midgard-validation midgard-fault-proofs midgard-watcher
      # The suite's global setup builds the native MPF owner binary.
      - name: Cache the native MPF cargo build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: demo/midgard-node/native/mpf-event-flat-wasm
      - name: Build Midgard node and migrate isolated CI database
        env:
          MIDGARD_DEPLOYMENT_PROFILE: preprod-testing
        run: pnpm --dir demo/midgard-node run db:migrate
      # The test run records each file's seconds (durationShards in
      # midgard-test-support); `test-durations` merges the shards' records into
      # the refreshed shard table.
      - name: Test Midgard node
        if: ${{ !cancelled() }}
        env:
          MIDGARD_FILE_DURATIONS_OUT: ${{ runner.temp }}/file-durations.json
        run: pnpm --dir demo/midgard-node run test --shard=${{ matrix.shard }}/3
      - name: Upload this shard's per-file test seconds
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: file-durations-midgard-node-${{ matrix.shard }}
          path: ${{ runner.temp }}/file-durations.json
          if-no-files-found: warn

  # Its eslint pass is the workspace-wide one in the `lint` job.
  midgard-node-tools:
    name: midgard-node-tools
    needs: [aiken-fork, blueprint]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: midgard
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d midgard"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/demo-setup
        with:
          blueprint: "true"
          prebuild: lucid-midgard midgard-core midgard-sdk midgard-validation midgard-fault-proofs midgard-watcher midgard-node
      - name: Typecheck, build, and test Midgard node tools
        run: |
          pnpm --dir demo/midgard-node-tools run typecheck
          pnpm --dir demo/midgard-node-tools run build
          node demo/midgard-node-tools/dist/index.js --help >/dev/null
          pnpm --dir demo/midgard-node-tools test
      # The pooled DA bond journey's tests need no devnet; its live test
      # skips without MIDGARD_WATCHER_JOURNEY_RUN_DIR and stays manual. The
      # prefix filter keeps a new journey test from being left out.
      - name: Test the pooled DA bond journey without a devnet
        run: |
          pnpm --dir demo/midgard-node-tools exec vitest run \
            --config vitest.watcher-journeys.config.ts \
            devnet/watcher-journeys/da-bond-pool-

  da-e2e:
    name: Canonical V1 retained multi-peer DA paths
    needs: [aiken-fork, blueprint]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: midgard
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d midgard"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/demo-setup
        with:
          blueprint: "true"
          prebuild: lucid-midgard midgard-core midgard-sdk midgard-validation midgard-fault-proofs midgard-watcher midgard-node midgard-node-tools
      - name: Verify canonical V1 retained multi-peer DA paths
        env:
          MIDGARD_RUN_DA_PHASE5_JOINED_E2E: "1"
          NODE_OPTIONS: --max-old-space-size=4096
        run: pnpm --dir demo/midgard-node run test:da-canonical-v1-e2e

  # The one check branch protection should require. It runs even when jobs
  # above failed or were skipped (GitHub reports a job whose dependency failed
  # as skipped, and a skipped required check reads as passing), and fails
  # unless every one of them succeeded.
  gate:
    name: Node CI gate
    if: ${{ !cancelled() }}
    needs:
      - aiken-fork
      - blueprint
      - test-blueprints
      - compose-render
      - node-image
