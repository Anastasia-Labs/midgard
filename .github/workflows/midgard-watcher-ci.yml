name: Midgard Watcher CI

on:
  push:
    branches: ["main"]
    paths:
      - "demo/midgard-watcher/**"
      - "demo/midgard-fault-proofs/**"
      - "demo/midgard-sdk/**"
      - "demo/midgard-core/**"
      - "demo/midgard-validation/**"
      - "demo/package.json"
      - "demo/pnpm-lock.yaml"
      - "demo/pnpm-workspace.yaml"
      - "demo/.nvmrc"
      - ".github/workflows/midgard-watcher-ci.yml"
  pull_request:
    paths:
      - "demo/midgard-watcher/**"
      - "demo/midgard-fault-proofs/**"
      - "demo/midgard-sdk/**"
      - "demo/midgard-core/**"
      - "demo/midgard-validation/**"
      - "demo/package.json"
      - "demo/pnpm-lock.yaml"
      - "demo/pnpm-workspace.yaml"
      - "demo/.nvmrc"
      - ".github/workflows/midgard-watcher-ci.yml"

permissions:
  contents: read

jobs:
  watcher:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: "1.25.7"
          cache-dependency-path: demo/midgard-watcher/native-chain-sync/go.sum
      - name: Assert and test pinned native chain-sync helper
        working-directory: demo/midgard-watcher/native-chain-sync
        run: |
          set -euo pipefail
          test "$(go version | awk '{print $3}')" = "go1.25.7"
          go mod verify
          go test ./...
          CGO_ENABLED=0 go build -trimpath -ldflags="-s -w -buildid=" -o /tmp/midgard-chain-sync .
          test -x /tmp/midgard-chain-sync
      # The watcher's TypeScript build, typecheck, lint, format check and test
      # suite run in midgard-node-ci.yml, which triggers on a superset of these
      # paths and builds the Aiken blueprint those tests read. This job covers
      # what that one does not: the native helper, the compose stack and the
      # production image.
      # The operator launch surface: the compose file must render from
      # `.env.example` alone, like the node stacks in midgard-node-ci.yml.
      - name: Render the watcher compose stack from .env.example
        working-directory: demo/midgard-watcher
        run: |
          set -euo pipefail
          docker compose --env-file .env.example -f compose.yaml config --quiet
          # Both services run the locally built image; any pulled image must
          # carry a tag other than latest.
          images="$(docker compose --env-file .env.example -f compose.yaml config --images)"
          if grep -vE '^midgard-watcher:' <<<"$images" | grep -E ':latest$|^[^:@]+$'; then
            echo "unpinned image in compose.yaml" >&2
            exit 1
          fi
      - name: Build watcher production image
        working-directory: demo
        run: docker build --file midgard-watcher/Dockerfile --tag midgard-watcher:ci .
      # The only check of the image's `authority` path: start the compose
      # service from the built image with throwaway secrets and the shipped
      # template, then require 401 without the bearer and 200 with it.
      - name: Smoke the trusted-head authority service from the built image
        working-directory: demo/midgard-watcher
        env:
          MIDGARD_WATCHER_IMAGE_TAG: ci
        run: |
          set -euo pipefail
          secrets="$RUNNER_TEMP/watcher-secrets"
          mkdir -p "$secrets" config
          openssl rand -hex 32 | tr -d '\n' >"$secrets/record_key"
          bearer="$(openssl rand -hex 24)"
          printf '%s' "$bearer" >"$secrets/bearer"
          cp authority.example.json config/authority.json
          export WATCHER_RECORD_KEY_FILE="$secrets/record_key"
          export WATCHER_BEARER_FILE="$secrets/bearer"
          compose() { docker compose --env-file .env.example -f compose.yaml "$@"; }
          trap 'compose logs watcher-authority; compose down --volumes' EXIT
          compose up --detach --no-build --wait --wait-timeout 90 watcher-authority
          identity=http://127.0.0.1:7401/v1/identity
          test "$(curl -s -o /dev/null -w '%{http_code}' "$identity")" = 401
          test "$(curl -s -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer $bearer" "$identity")" = 200
