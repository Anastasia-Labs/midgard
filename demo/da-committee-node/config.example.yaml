# Copy to config.yaml (git-ignored), chmod 600, and supply the committee keys.
# Each process selects one signer using DA_SIGNER_INDEX. Set it in the process
# environment to override the file's default; do not mix indexed and single sources.
{}
# DA_SIGNER_INDEX: "0"
# DA_SIGNER_KEY_SOURCE_0: "cardano-seed:member 0 mnemonic"
# DA_SIGNER_KEY_SOURCE_1: "cardano-seed:member 1 mnemonic"
# L1_SUBMITTER_KEY_SOURCE: "seed:L1 fee-paying wallet mnemonic"
# DA_AVAILABILITY_SUBMITTER_KEY_SOURCE: "seed:availability responder mnemonic"
# DA_LIBP2P_PRIVATE_KEY_SOURCE: "seed:32-byte-hex-transport-seed"
# Opt-in, log-only retention deadline alert: a still-challengeable payload
# with at most this many ms left is logged as da_retention_deadline_alert.
# Unset: no alert. It never affects /readyz: every merged payload ages into
# the threshold on its normal way to pruning, so an alert is not a fault.
# Must be below block maturity / 2 (the most a merged payload has left:
# 450000 on the testing profiles), or it is refused at startup.
# DA_RETENTION_ALERT_THRESHOLD_MS: "60000"
# Existing deployment/local-node/database settings can also be specified here.
# No chain index (Kupo, Ogmios) is configured: the committee reads L1 through
# its own follower on the local node.
# Remove {} when uncommenting settings. Do not paste real seeds into this example.
