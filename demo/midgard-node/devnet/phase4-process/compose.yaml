name: ${MIDGARD_PHASE4_COMPOSE_PROJECT:?MIDGARD_PHASE4_COMPOSE_PROJECT is required}

services:
  cardano-node:
    image: ghcr.io/intersectmbo/cardano-node:11.0.1@sha256:33378c806485729154e6652ffc6813748949ae049180788b94018a709f5a0400
    entrypoint: ["entrypoint"]
    environment:
      CARDANO_BLOCK_PRODUCER: ${MIDGARD_PHASE4_BLOCK_PRODUCER:-true}
      CARDANO_SHELLEY_KES_KEY: /genesis/pools-keys/pool1/kes.skey
      CARDANO_SHELLEY_VRF_KEY: /genesis/pools-keys/pool1/vrf.skey
      CARDANO_SHELLEY_OPERATIONAL_CERTIFICATE: /genesis/pools-keys/pool1/opcert.cert
    command:
      - run
      - --config
      - /config/config.json
      - --topology
      - /config/topology.json
      - --database-path
      - /data/db
      - --socket-path
      - /ipc/node.socket
      - --shelley-kes-key
      - /genesis/pools-keys/pool1/kes.skey
      - --shelley-vrf-key
      - /genesis/pools-keys/pool1/vrf.skey
      - --shelley-operational-certificate
      - /genesis/pools-keys/pool1/opcert.cert
      - --host-addr
      - 0.0.0.0
      - --port
      - "3001"
    volumes:
      - ${MIDGARD_PHASE4_RUN_DIR:?MIDGARD_PHASE4_RUN_DIR is required}/config:/config:ro
      - ${MIDGARD_PHASE4_RUN_DIR}/genesis:/genesis:ro
      - ${MIDGARD_PHASE4_RUN_DIR}/cardano/db:/data/db
      - ${MIDGARD_PHASE4_RUN_DIR}/cardano/ipc:/ipc
    healthcheck:
      test: ["CMD-SHELL", "test -S /ipc/node.socket"]
      interval: 2s
      timeout: 2s
      retries: 60
    restart: "no"

  ogmios:
    image: cardanosolutions/ogmios:v7.0.0@sha256:8892ef5f77b94f1c95427cf9f2b40e6235a32b27a8b1e378db02289f3991617f
    command:
      - --host
      - 0.0.0.0
      - --port
      - "1337"
      - --node-config
      - /config/config.json
      - --node-socket
      - /ipc/node.socket
    depends_on:
      cardano-node:
        condition: service_healthy
    volumes:
      - ${MIDGARD_PHASE4_RUN_DIR}/config:/config:ro
      - ${MIDGARD_PHASE4_RUN_DIR}/genesis:/genesis:ro
      - ${MIDGARD_PHASE4_RUN_DIR}/cardano/ipc:/ipc
    ports:
      - "127.0.0.1:${MIDGARD_PHASE4_OGMIOS_PORT:-2337}:1337"
    healthcheck:
      test: ["CMD", "/bin/ogmios", "health-check"]
      interval: 2s
      timeout: 2s
      retries: 60
    restart: "no"

  kupo:
    image: cardanosolutions/kupo:v2.11.0@sha256:0a8cd8b5e373103e9e0a68b162d82c69a6f76042bb073c31912724034e51ca9e
    command:
      - --ogmios-host
      - ogmios
      - --ogmios-port
      - "1337"
      - --host
      - 0.0.0.0
      - --port
      - "1442"
      - --workdir
      - /db
      - --since
      - origin
      - --match
      - "*"
    depends_on:
      ogmios:
        condition: service_healthy
    volumes:
      - ${MIDGARD_PHASE4_RUN_DIR}/kupo:/db
    ports:
      - "127.0.0.1:${MIDGARD_PHASE4_KUPO_PORT:-2442}:1442"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:1442/health"]
      interval: 2s
      timeout: 2s
      retries: 60
    restart: "no"

  postgres:
    image: postgres:15.15-alpine@sha256:d4c38e1c60871a1e8fe5d05b639980ac7827c9e6920a5df663a16f86f398aca6
    environment:
      POSTGRES_USER: ${MIDGARD_PHASE4_POSTGRES_USER:-midgard_phase4_process}
      POSTGRES_PASSWORD: ${MIDGARD_PHASE4_POSTGRES_PASSWORD:?MIDGARD_PHASE4_POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${MIDGARD_PHASE4_POSTGRES_DATABASE:?MIDGARD_PHASE4_POSTGRES_DATABASE is required}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - ${MIDGARD_PHASE4_RUN_DIR}/postgres:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${MIDGARD_PHASE4_POSTGRES_PORT:-5544}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB -h 127.0.0.1"]
      interval: 2s
      timeout: 2s
      retries: 60
    restart: "no"
