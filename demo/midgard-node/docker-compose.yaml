x-logging:
  &default-logging
  driver: "json-file"
  options:
    max-size: "1m"
    max-file: "1"
    tag: "{{.Name}}"

services:
  midgard-node:
    build:
      context: ..
      additional_contexts:
        - onchain=../../onchain/aiken
      dockerfile: midgard-node/Dockerfile
    env_file:
      - .env
    labels:
      logging: "promtail"
      logging_jobname: "containerlogs"
    command:
      - node
      - ./dist/index.js
      - listen
      - --with-monitoring
    ports:
      # Host ports: see scripts/operator-compose.mjs. A linked git worktree
      # launched through it gets its own; the main checkout keeps these.
      - "${MIDGARD_NODE_API_HOST_PORT:-${PORT:-3000}}:${PORT:-3000}" # api server (PORT from .env, default 3000)
      - "${MIDGARD_NODE_METRICS_HOST_PORT:-9464}:9464" # prometheus exporter
      - "${MIDGARD_NODE_DA_HOST_PORT:-39002}:39002" # DA libp2p producer
      # - "4318:4318" # opentelemetry
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./db:/app/db
      - ./deploymentInfo:/app/deploymentInfo
    mem_limit: "8g"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:${PORT:-3000}/readyz').then((response)=>process.exit(response.ok?0:1)).catch(()=>process.exit(1))
      interval: 5s
      timeout: 3s
      retries: 60
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
      midgard-node-migrate:
        condition: service_completed_successfully
    logging: *default-logging
    restart: always
    networks:
      midgard_net:

  midgard-node-migrate:
    build:
      context: ..
      additional_contexts:
        - onchain=../../onchain/aiken
      dockerfile: midgard-node/Dockerfile
    env_file:
      - .env
    command:
      - node
      - ./dist/index.js
      - db:migrate
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    logging: *default-logging
    networks:
      midgard_net:
  
  postgres:
    image: postgres:15.15-alpine
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres-data:/var/lib/postgresql/data/pgdata
    ports:
      - "${MIDGARD_POSTGRES_HOST_PORT:-5433}:5432"
    networks:
      midgard_net:
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB -h 127.0.0.1 -p 5432"]
      interval: 2s
      timeout: 3s
      retries: 30
    command:
      - "postgres"
      - "-c"
      - "max_connections=100"
      - "-c"
      - "shared_buffers=2GB"
      - "-c"
      - "effective_cache_size=6GB"
      - "-c"
      - "work_mem=16MB"
      - "-c"
      - "maintenance_work_mem=512MB"
    logging:
      options:
        max-size: "10m"
        max-file: "3"

  prometheus:
    image: prom/prometheus:v3.5.1
    container_name: ${MIDGARD_OPERATOR_CONTAINER_PREFIX:-}prometheus
    ports:
      - "${MIDGARD_PROMETHEUS_HOST_PORT:-9090}:9090"
    user: root
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-remote-write-receiver
      - --enable-feature=exemplar-storage
      - --enable-feature=native-histograms
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    logging: *default-logging
    networks:
      midgard_net:

  loki:
    container_name: ${MIDGARD_OPERATOR_CONTAINER_PREFIX:-}loki
    image: grafana/loki:3.6.4
    ports:
      - "${MIDGARD_LOKI_HOST_PORT:-3100}:3100"
    command:
      - -config.file=/etc/loki/local-config.yaml
    volumes:
      - ./loki-config.yaml:/etc/loki/local-config.yaml:ro
    logging: *default-logging
    networks:
      midgard_net:

  promtail:
    image: grafana/promtail:3.6.4
    container_name: ${MIDGARD_OPERATOR_CONTAINER_PREFIX:-}promtail
    volumes:
      - /var/log:/var/log
      - ./promtail-config.yaml:/etc/promtail/config.yaml
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock
    command: -config.file=/etc/promtail/config.yaml
    depends_on:
      - loki
    networks:
      midgard_net:

  cadvisor:
    image: ghcr.io/google/cadvisor:0.56.2
    hostname: cadvisor
    volumes:
      - "/:/rootfs:ro"
      - "/var/run:/var/run:ro"
      - "/sys:/sys:ro"
      - "/var/lib/docker/:/var/lib/docker:ro"
      - "/dev/disk/:/dev/disk:ro"
    logging: *default-logging
    ports:
      - "${MIDGARD_CADVISOR_HOST_PORT:-8080}:8080"
    networks:
      midgard_net:

  grafana:
    container_name: ${MIDGARD_OPERATOR_CONTAINER_PREFIX:-}grafana
    image: grafana/grafana:12.3.2
    ports:
      - "${MIDGARD_GRAFANA_HOST_PORT:-3001}:3000"
    environment:
      - GF_PATHS_PROVISIONING=/etc/grafana/provisioning
      - DS_PROMETHEUS=prometheus
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_FEATURE_TOGGLES_ENABLE=traceqlEditor metricsSummary
    volumes:
      - "grafana-data:/var/lib/grafana"
      - "./grafana/datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml"
      - "./grafana/dashboard.json:/var/lib/grafana/dashboards/dashboard.json"
      - "./grafana/default.yaml:/etc/grafana/provisioning/dashboards/default.yaml"
    depends_on:
      - prometheus
      - loki
    logging: *default-logging
    networks:
      midgard_net:
  tempo-init:
    image: busybox:1.37.0
    user: root
    entrypoint:
      - "chown"
      - "10001:10001"
      - "/var/tempo"
    volumes:
      # Same named volume tempo mounts below; a bind mount here would chown a
      # stray host directory and leave the real volume untouched.
      - tempo-data:/var/tempo
    networks:
      midgard_net:

  tempo:
    image: grafana/tempo:2.10.0
    command: [-config.file=/etc/tempo.yaml]
    volumes:
      - ./tempo.yaml:/etc/tempo.yaml
      - tempo-data:/var/tempo
    ports:
      - "${MIDGARD_TEMPO_JAEGER_HOST_PORT:-14268}:14268" # jaeger ingest
      - "${MIDGARD_TEMPO_HTTP_HOST_PORT:-3200}:3200" # tempo
      - "${MIDGARD_TEMPO_GRPC_HOST_PORT:-9095}:9095" # tempo grpc
      - "${MIDGARD_TEMPO_OTLP_GRPC_HOST_PORT:-4317}:4317" # otlp grpc
      - "${MIDGARD_TEMPO_OTLP_HTTP_HOST_PORT:-4318}:4318" # otlp http
      - "${MIDGARD_TEMPO_ZIPKIN_HOST_PORT:-9411}:9411" # zipkin
    depends_on:
      - tempo-init
    logging: *default-logging
    networks:
      midgard_net:

  midgard-node-tests:
    build:
      context: ..
      additional_contexts:
        - onchain=../../onchain/aiken
      dockerfile: midgard-node/Dockerfile
    env_file:
      - .env
    command: ["sh", "-c", "yes | pnpm test"]
    profiles:
      - test
    volumes:
      - ./:/app
      - ./db:/app/db
    depends_on:
      - postgres
    networks:
      midgard_net:
    logging: *default-logging
    environment:
      - COREPACK_EXPERIMENTAL_SKIP_ASK=true

networks:
  midgard_net:

volumes:
  postgres-data:
    driver: local
  grafana-data:
    driver: local
  prometheus-data:
    driver: local
  tempo-data:
    driver: local
