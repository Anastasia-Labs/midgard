# In-stack Cardano L1 for midgard-node: cardano-node (Mithril-bootstrapped),
# Ogmios and Kupo. This is the canonical L1 stack for every Midgard role; hosts
# that run only a watcher or a DA committee node start just the L1 services:
#
#   docker compose -f docker-compose.yaml -f docker-compose.kupmios.yaml \
#     up -d cardano-node-ogmios kupo
#
# Image pins: every image below is pinned by tag AND digest, with one default
# per image shared by every service that names it. Change the tag and digest
# together (see .env.example). CARDANO_NODE_IMAGE_TAG must stay a bare
# version because the Mithril bootstrap compares it against the certified
# snapshot's cardano_node_version.

x-l1-env: &l1-env
  L1_PROVIDER: Kupmios
  L1_OGMIOS_KEY: http://cardano-node-ogmios:1337
  L1_KUPO_KEY: http://kupo:1442

services:
  midgard-node:
    environment: *l1-env
    depends_on:
      postgres:
        condition: service_healthy
      cardano-node-ogmios:
        condition: service_healthy
      kupo:
        condition: service_healthy

  # db:migrate loads the full node config, so it needs the same in-stack L1
  # endpoints as midgard-node even though it only touches Postgres.
  midgard-node-migrate:
    environment: *l1-env

  mithril-bootstrap:
    image: ghcr.io/intersectmbo/mithril-client:${MITHRIL_CLIENT_IMAGE_TAG:-2630.1-hotfix-3f6cb73@sha256:e512868501e19aaff39764909d6eccc473449da36567ba8d6fd652a24630a1e5}
    entrypoint:
      - /bin/sh
      - /bootstrap/bootstrap-kupmios-mithril.sh
    environment:
      NETWORK: ${NETWORK}
      CARDANO_NODE_IMAGE_TAG: ${CARDANO_NODE_IMAGE_TAG:-11.1.0}
      MITHRIL_AGGREGATOR_ENDPOINT: ${MITHRIL_AGGREGATOR_ENDPOINT:-}
      MITHRIL_GENESIS_VERIFICATION_KEY_URL: ${MITHRIL_GENESIS_VERIFICATION_KEY_URL:-}
      MITHRIL_ANCILLARY_VERIFICATION_KEY_URL: ${MITHRIL_ANCILLARY_VERIFICATION_KEY_URL:-}
      MITHRIL_SNAPSHOT_DIGEST: ${MITHRIL_SNAPSHOT_DIGEST:-latest}
    volumes:
      - ./cardano:/data
      - ./scripts/bootstrap-kupmios-mithril.sh:/bootstrap/bootstrap-kupmios-mithril.sh:ro
    restart: "no"
    networks:
      midgard_net:

  kupo-bootstrap:
    image: ghcr.io/intersectmbo/mithril-client:${MITHRIL_CLIENT_IMAGE_TAG:-2630.1-hotfix-3f6cb73@sha256:e512868501e19aaff39764909d6eccc473449da36567ba8d6fd652a24630a1e5}
    entrypoint:
      - /bin/sh
      - /bootstrap/bootstrap-kupo-snapshot.sh
    environment:
      NETWORK: ${NETWORK}
      KUPO_BOOTSTRAP_MODE: ${KUPO_BOOTSTRAP_MODE:-snapshot}
      KUPO_SNAPSHOT_RELEASE_TAG: ${KUPO_SNAPSHOT_RELEASE_TAG:-v2.8}
      KUPO_SNAPSHOT_URL: ${KUPO_SNAPSHOT_URL:-}
      KUPO_SNAPSHOT_MD5: ${KUPO_SNAPSHOT_MD5:-}
    volumes:
      - ./cardano:/data
      - ./scripts/bootstrap-kupo-snapshot.sh:/bootstrap/bootstrap-kupo-snapshot.sh:ro
    restart: "no"
    networks:
      midgard_net:

  cardano-node:
    image: ghcr.io/intersectmbo/cardano-node:${CARDANO_NODE_IMAGE_TAG:-11.1.0}@${CARDANO_NODE_IMAGE_DIGEST:-sha256:7b36384afd9d78e787c02f9b9a0868ed74b28a04b7d447325a68b1f397ddb43a}
    entrypoint:
      - /bin/sh
      - /bootstrap/run-cardano-node.sh
    environment:
      NETWORK: ${NETWORK}
    depends_on:
      mithril-bootstrap:
        condition: service_completed_successfully
    volumes:
      - ./cardano/db:/data/db
      - ./cardano/ipc:/ipc
      - ./scripts/run-cardano-node.sh:/bootstrap/run-cardano-node.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "test -S /ipc/node.socket"]
      interval: 15s
      timeout: 5s
      retries: 40
      start_period: 20s
    ports:
      - "${CARDANO_NODE_EKG_PORT:-12788}:12788"
      - "${CARDANO_NODE_PROM_PORT:-12798}:12798"
    restart: always
    networks:
      midgard_net:

  cardano-node-ogmios:
    image: cardanosolutions/ogmios:${OGMIOS_IMAGE_TAG:-v7.0.0@sha256:8892ef5f77b94f1c95427cf9f2b40e6235a32b27a8b1e378db02289f3991617f}
    entrypoint:
      - /bin/sh
      - /bootstrap/run-ogmios.sh
    environment:
      NETWORK: ${NETWORK}
    depends_on:
      cardano-node:
        condition: service_healthy
    volumes:
      - ./cardano/ipc:/ipc
      - ./scripts/run-ogmios.sh:/bootstrap/run-ogmios.sh:ro
    ports:
      - "${OGMIOS_PORT:-1337}:1337"
    healthcheck:
      test: ["CMD-SHELL", "/bin/ogmios health-check"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: always
    networks:
      midgard_net:

  kupo:
    image: cardanosolutions/kupo:${KUPO_IMAGE_TAG:-v2.11.0@sha256:0a8cd8b5e373103e9e0a68b162d82c69a6f76042bb073c31912724034e51ca9e}
    # No --prune-utxo: the node's forced-order carriage reader
    # (src/l1-tx-order-carriage.ts) reads spent carriage outputs, which a
    # pruning index deletes. The official Kupo snapshot restored by
    # kupo-bootstrap was itself built pruned, so outputs spent before the
    # snapshot point are absent. That is fine for a deployment initialised
    # after this bring-up (the usual case); to serve a deployment whose L1
    # history predates the snapshot, set KUPO_BOOTSTRAP_MODE=origin and let
    # Kupo sync from origin instead. Kupo >= v2.10.0 is required for the
    # ?resolve_hashes query the same reader depends on.
    command:
      - --ogmios-host
      - cardano-node-ogmios
      - --ogmios-port
      - "1337"
      - --host
      - 0.0.0.0
      - --port
      - "1442"
      - --workdir
      - /db
      - --since
      - origin
      - --match
      - "*"
      - --defer-db-indexes
    depends_on:
      cardano-node-ogmios:
        condition: service_healthy
      kupo-bootstrap:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -S -q -O /dev/null http://127.0.0.1:1442/health 2>&1 | grep -Eq 'HTTP/[0-9.]+ 200'",
        ]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 20s
    volumes:
      - ./cardano/kupo:/db
    ports:
      - "${KUPO_PORT:-1442}:1442"
    restart: always
    networks:
      midgard_net:
