services:
  midgard-node:
    build:
      context: ..
      additional_contexts:
        - onchain=../../onchain/aiken
      dockerfile: midgard-node/Dockerfile
    env_file:
      - .env
    labels:
      logging: "promtail"
      logging_jobname: "containerlogs"
    command:
      - node
      - ./dist/index.js
      - listen
    ports:
      - "${MIDGARD_NODE_API_HOST_PORT:-${PORT:-3000}}:${PORT:-3000}" # api server (PORT from .env, default 3000)
    volumes:
      - ./db:/app/db
      - ./deploymentInfo:/app/deploymentInfo
    depends_on:
      postgres:
        condition: service_healthy
      midgard-node-migrate:
        condition: service_completed_successfully
    networks:
      midgard_net:

  midgard-node-migrate:
    build:
      context: ..
      additional_contexts:
        - onchain=../../onchain/aiken
      dockerfile: midgard-node/Dockerfile
    env_file:
      - .env
    command:
      - node
      - ./dist/index.js
      - db:migrate
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    networks:
      midgard_net:

  postgres:
    image: postgres:15.15-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres-data:/var/lib/postgresql/data/pgdata
    ports:
      - "${MIDGARD_POSTGRES_HOST_PORT:-5433}:5432"
    networks:
      midgard_net:
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB -h 127.0.0.1 -p 5432"]
      interval: 2s
      timeout: 3s
      retries: 30

networks:
  midgard_net:

volumes:
  postgres-data:
    driver: local
