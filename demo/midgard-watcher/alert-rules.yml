# Alert rules for a Midgard watcher. The watcher serves `/metrics` (Prometheus
# text) on its loopback operations endpoint (`operationsEndpoint` in the
# watcher process configuration), so the Prometheus that loads this file runs
# on the watcher's host. Each alert's runbook section is in
# docs/operations/alerts.md (the anchor is the alert name in lower case). The
# `for` durations and windows are starting values.
groups:
  - name: midgard-watcher
    rules:
      - alert: MidgardWatcherReplayRootMismatch
        # The replayed ledger does not open the root of the L1 confirmed
        # state; the watcher holds its checkpoint until it does.
        expr: midgard_watcher_active_alerts{code="root_mismatch"} > 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Watcher {{ $labels.instance }} cannot replay the confirmed state's root"
          runbook: "docs/operations/alerts.md#midgardwatcherreplayrootmismatch"

      - alert: MidgardWatcherConfirmedReplayRefused
        expr: >-
          increase(midgard_watcher_replay_refusals_total{phase="confirmed",kind="replay-refused"}[30m]) > 0
        labels:
          severity: warning
        annotations:
          summary: "Watcher {{ $labels.instance }} refused to replay a block on the way to the confirmed state"
          runbook: "docs/operations/alerts.md#midgardwatcherconfirmedreplayrefused"

      - alert: MidgardWatcherBlockReplayMismatch
        # A committed block whose replay does not open its root: the
        # fault-proof path should follow.
        expr: >-
          increase(midgard_watcher_replay_refusals_total{phase="classification"}[30m]) > 0
        labels:
          severity: warning
        annotations:
          summary: "Watcher {{ $labels.instance }} found a block whose replay is refused ({{ $labels.kind }})"
          runbook: "docs/operations/alerts.md#midgardwatcherblockreplaymismatch"

      - alert: MidgardWatcherL1EventRefusals
        expr: >-
          midgard_watcher_l1_degradation{reason=~"l1_user_event_refused|l1_event_refusals_unreadable"} > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Watcher {{ $labels.instance }} follower refuses L1 user events ({{ $labels.reason }})"
          runbook: "docs/operations/alerts.md#midgardwatcherl1eventrefusals"

      - alert: MidgardWatcherProofSubmissionFailure
        expr: midgard_watcher_active_alerts{code="proof_submission_failure"} > 0
        labels:
          severity: critical
        annotations:
          summary: "Watcher {{ $labels.instance }} could not land a fault proof"
          runbook: "docs/operations/alerts.md#midgardwatcherproofsubmissionfailure"

      - alert: MidgardWatcherProofHeld
        expr: >-
          midgard_watcher_readiness_reason{reason=~"fault_proof_continuation_stalled|fault_proof_objective_quarantined|fault_proof_start_deadline_passed|fault_proof_l1_refused:.*"} > 0
        labels:
          severity: critical
        annotations:
          summary: "Watcher {{ $labels.instance }} holds a fault proof ({{ $labels.reason }})"
          runbook: "docs/operations/alerts.md#midgardwatcherproofheld"

      - alert: MidgardWatcherProverFundingUnavailable
        # A fault-proof objective paused because the prover wallet cannot
        # fund its next transaction; the next run after a top-up resumes it.
        expr: midgard_watcher_active_alerts{code="prover_funding_unavailable"} > 0
        labels:
          severity: critical
        annotations:
          summary: "Watcher {{ $labels.instance }} cannot fund a fault proof"
          runbook: "docs/operations/alerts.md#midgardwatcherproverfundingunavailable"

      - alert: MidgardWatcherProofStartedLate
        # A fault proof runs after its latest safe start; it must land
        # before its header matures.
        expr: midgard_watcher_active_alerts{code="maturity_deadline_risk"} > 0
        labels:
          severity: critical
        annotations:
          summary: "Watcher {{ $labels.instance }} is racing a fault proof against maturity"
          runbook: "docs/operations/alerts.md#midgardwatcherproofstartedlate"

      - alert: MidgardWatcherProofDeadline
        expr: midgard_watcher_readiness_reason{reason=~"deadline_at_risk|deadline_unsafe"} > 0
        labels:
          severity: critical
        annotations:
          summary: "Watcher {{ $labels.instance }} fault-proof deadline is at risk ({{ $labels.reason }})"
          runbook: "docs/operations/alerts.md#midgardwatcherproofdeadline"

      - alert: MidgardWatcherFaultDetectorFailed
        # A fault-proof family could not replay a committed block, and no
        # other family decides it; no later header is proven meanwhile. A
        # header the other families decide clears it in the same pass.
        expr: midgard_watcher_active_alerts{code="fault_detector_failed"} > 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Watcher {{ $labels.instance }} cannot decide a block: a fault detector fails on it"
          runbook: "docs/operations/alerts.md#midgardwatcherfaultdetectorfailed"

      - alert: MidgardWatcherProofFamilyCoverageGap
        # A committed block's finding that no installed fault-proof family
        # proves; the watcher keeps deciding the later blocks.
        expr: midgard_watcher_active_alerts{code="proof_family_coverage_gap"} > 0
        labels:
          severity: critical
        annotations:
          summary: "Watcher {{ $labels.instance }} found a block it cannot prove faulty or healthy"
          runbook: "docs/operations/alerts.md#midgardwatcherprooffamilycoveragegap"

      - alert: MidgardWatcherUnprovenFaultMerged
        # A block this watcher found faulty merged into confirmed state
        # before any proof removed it. The active alert never clears, so it
        # pages for 30 minutes from each recorded merge instead, one series
        # (and alert) per header: each new merge pages on its own, even one
        # a restart's first pass records after a long outage or one inside
        # an earlier merge's window, and a restart that finds none new does
        # not.
        expr: >-
          time() - midgard_watcher_unproven_fault_merge_timestamp_seconds < 1800
        labels:
          severity: critical
        annotations:
          summary: "Watcher {{ $labels.instance }} saw block {{ $labels.header }}, which it found faulty, merge unproven"
          runbook: "docs/operations/alerts.md#midgardwatcherunprovenfaultmerged"
