# demo/midgard-watcher/compose.yaml: the watcher on one host, with host
# networking.
#
# Requires a Cardano node on this host: its socket directory and its
# node/genesis config directory.
# Every endpoint the watcher dials or serves must be loopback, which is why the
# service uses the host network namespace. See README.md, "Running with compose".
#
# Copy the templates before the first `up`:
#   config/watcher-process.json  from watcher-process.example.json
#   config/watcher-runtime.json  the `watcherConfig` object of watcher-process.json
#   bundles/                     the six release artifacts that config names
x-image: &image
  build: { context: .., dockerfile: midgard-watcher/Dockerfile }
  image: midgard-watcher:${MIDGARD_WATCHER_IMAGE_TAG:-local}
  network_mode: host
  environment:
    MALLOC_MMAP_THRESHOLD_: "131072"
  # Restarting is the supervision. `on-failure` with a retry cap would strand
  # the watcher.
  restart: unless-stopped
  logging: { driver: json-file, options: { max-size: "10m", max-file: "3" } }

services:
  watcher:
    <<: *image
    # The image CMD is `start --config /etc/midgard/watcher-process.json`.
    volumes:
      - ./config/watcher-process.json:/etc/midgard/watcher-process.json:ro
      # `watcherRuntimeConfigPath`
      - ./config/watcher-runtime.json:/etc/midgard/watcher-runtime.json:ro
      # deploymentAuthorityPath, ruleBundlePath, fundingProfileBundlePath and
      # the fault-proof manifest, blueprint and deployment info.
      - ./bundles:/etc/midgard/bundles:ro
      # SQLite store, workflow journal, availability journal and the
      # fault-proof journals (watcher-journals.sqlite). A local volume: never
      # back it with a network filesystem (NFS, SMB), which breaks SQLite's
      # locking and its write-ahead log.
      - watcher-state:/var/lib/midgard-watcher
      # The L1 stack's node socket (`socketPath`) and config directory
      # (`nodeConfigPath`, `genesisConfigPath`). The IPC default moves to
      # ../l1-stack/ once the shared L1 stack lands there.
      - ${MIDGARD_L1_IPC_DIR:-../midgard-node/cardano/ipc}:/ipc
      - ${MIDGARD_L1_CONFIG_DIR:?}:/cardano-config:ro
      # Regular files, not compose `secrets:`: the loader refuses a secret path
      # that resolves through a symlink.
      - ${WATCHER_ROLLBACK_KEY_FILE:?}:/run/secrets/rollback_key:ro
      - ${WATCHER_PROVER_KEY_FILE:?}:/run/secrets/prover_key:ro
      - ${WATCHER_AVAILABILITY_KEY_FILE:?}:/run/secrets/availability_key:ro
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:${WATCHER_OPERATIONS_PORT:-7402}/v1/status').then(r=>process.exit(r.status===200||r.status===401?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 120s

volumes:
  watcher-state: {}
