name: preprod-public
network: Preprod
l1_finality:
  confirmation_depth: 30
  # Largest d with event_wait - max validity range >= 3d/f slots:
  # 1,320,000 ms / 60,000 ms = 22 (config/deployments/README.md).
  commit_event_depth: 22
  # Cardano consensus the depth bounds assume: k, f and the slot length.
  security_parameter: 2160
  active_slot_coeff: "0.05"
  slot_length_ms: 1000
timing:
  block_maturity_ms: 604800000
  dispute_response_window_ms: 300000
  # Validation-trace chess clock (pd-design §6.3). Each side's cumulative budget C,
  # the longest dispute-move validity range L_d, and the resolution allowance R.
  # Measured on the emulator at the preprod Conway fee parameters (2026-10-21):
  # - C: a move is charged only the time past the previous move's validity
  #   range (1 ms per move on the emulator). The 34 charged moves of one side
  #   fit in C at up to 2,541 s each; a 30-block wait at 3/f slots is 1,800 s.
  # - R: the longest one-step resolution chain is 19 transactions
  #   (EnterResolution, 17 resolve hops, the award close). At 3/f slots =
  #   60,000 ms per block, 19 x 60 s x 3 = 3,420 s per thread, so R covers six
  #   threads played one move at a time (two curated operators: 6,840 s).
  dispute_side_clock_ms: 86400000
  dispute_max_validity_range_ms: 120000
  dispute_resolution_allowance_ms: 21600000
  operator_shift_ms: 3600000
  registration_ms: 30000
  event_wait_ms: 1800000 # worst case for 30 blocks = 3N/f slots = 3*30/0.05 s (30 min)
  user_events_negligence_timeout_ms: 1200000
  new_shift_inactivity_grace_period_ms: 480000
  max_validity_range_ms: 480000
  max_event_validity_range_ms: 600000
  da_attestation_timeout_ms: 3600000
  da_small_response_window_ms: 3600000
  da_full_response_window_ms: 172800000
  # 24 h (owner, 2026-10-15). With the 48 h full response window and the
  # 8 min maximum validity range the latest DA answer lands by
  # 86,400,000 + 480,000 + 172,800,000 = 259,680,000 ms after block end,
  # before maturity (604,800,000) and before the case open deadline M/2
  # (302,400,000).
  da_challenge_window_ms: 86400000
  da_slash_grace_ms: 172800000
  # validity + max(window + full response, maturity) + grace:
  # 480,000 + max(259,200,000, 604,800,000) + 172,800,000. Maturity
  # dominates, so the 24 h window leaves the delay unchanged.
  da_bond_withdraw_delay_ms: 778080000
da_transport:
  # P1 participants bootstrap by replaying retained inputs from empty genesis.
  retention_days: 120
da_bond:
  da_bond_lovelace: 100000000000
  da_slash_penalty_lovelace: 25000000000
  da_bond_min_top_up_lovelace: 1000000000
  da_bond_pool_floor_lovelace: 5000000
  # min-UTxO of the largest admitted ChallengeRecordV1 (64 tranche
  # descriptors at worst-case field widths, 32-byte DACH token, inline datum,
  # enterprise script address): datum 5,838 B, output 5,953 B,
  # (160 + 5,953) x 4,310 = 26,347,030 lovelace, rounded up to a whole ADA.
  # A stake credential on the address (+28 B) would need 26,467,710.
  challenge_record_lovelace: 27000000
limits:
  max_bisection_rounds: 32
  # P1: out of reach, so a strike skips the shift but never ejects an operator.
  max_inactivity_strikes: 1000000
  coins_per_utxo_byte: 4310
  # Most a validation-trace move may take from its thread for the fee
  # (pd-design 6.5): at least 2 x the measured largest reveal (377,315
  # lovelace, depth 32); larger one-step hops are wallet-paid.
  max_dispute_move_fee_lovelace: 1200000
  # Least lovelace of a validation-trace fraud-proof output: above the
  # measured min-UTxO of that fixed-shape output, (160 + 148 B) x 4,310 =
  # 1,327,480 lovelace (1,448,160 with a stake credential on the address).
  fraud_proof_output_lovelace: 2000000
economics:
  profile: public-preprod-launch-v1
  requiredBondLovelace: 100000000000
  slashingPenaltyLovelace: 25000000000
  inactivitySlashingPenaltyLovelace: 10000000000
  fraudProverRewardLovelace: 75000000000
  proverCollateralFloorLovelace: 5000000
# Forfeited validation-dispute bonds go to the protocol treasury
# (pd-design §6.4): an owner-quorum native script in the cardano-cli JSON
# form, separate from the reserve. Its hash is derived by the generator.
# P1 keys: payment key hashes of three Preprod treasury wallets, any two of
# which sign.
protocol_treasury_native_script:
  type: atLeast
  required: 2
  scripts:
    - type: sig
      keyHash: "f1fb1abc10fc4d90b367c7f994b87aeeb4db60fa8a42ee43a159256c"
    - type: sig
      keyHash: "9ac54f4b18dcdbaeb981b9acbb4e79b590315eb508a08b3a50509cb9"
    - type: sig
      keyHash: "65a0683b5ca28e4a8fed2b5a443210741faad5ed43802d20fd329a53"
allow_lists:
  # P1 curated operators (owner input I1): payment key hashes of the Preprod
  # operator wallets. Fault provers and DA challengers are permissionless.
  operators:
    - "041388eef29da389e7b9dac19509ef8ac95a398a9909991a4326d424"
    - "4189f341bddd0c74ecb4f5a1ddae8653ee204be022fe530e2f65a6a6"
# The Plutus execution dispute (validationTraceDispute, 00000006) is in the
# catalogue at launch (owner, 2026-10-21). The families below have no
# installed off-chain workflow yet (UNINSTALLED_FRAUD_PROOF_CATEGORIES in
# midgard-fault-proofs), so they are left out of the fraud-proof catalogue
# and Computation-Thread Init refuses them.
excluded_fraud_proof_categories:
  - executionSourceScriptDecoding
  - receivePurposeLanguage
  - unusedScriptWitness
  - missingScriptSource
  - unusedRedeemer
  - executionNativeScriptInvalid
  - scriptIntegrityHashMismatch
  - distinctAssetAccumulationLimit
