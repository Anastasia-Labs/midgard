name: mainnet
network: Mainnet
l1_finality:
  confirmation_depth: 30
  # Events are committed only below the commit anchor, commit_event_depth
  # blocks under the follower view a commit is planned at. Here d = k, so
  # W - L = 129,600,000 = 3d/f slots exactly; config/deployments/README.md
  # derives both bounds.
  commit_event_depth: 2160
  # Cardano consensus the depth bounds assume: k, f and the slot length.
  security_parameter: 2160
  active_slot_coeff: "0.05"
  slot_length_ms: 1000
timing:
  block_maturity_ms: 604800000
  dispute_response_window_ms: 300000
  operator_shift_ms: 3600000
  registration_ms: 30
  # 3k/f slots + max validity range = 3*2160/0.05 s + 480 s = 129,600,000 +
  # 480,000 ms (36 h 8 min). A commit lands no earlier than one maximum
  # validity range before its header end time, so when the commit that
  # includes a due event lands, the event is at least 3k/f slots old: k
  # blocks deep under the guaranteed chain-growth bound.
  event_wait_ms: 130080000
  user_events_negligence_timeout_ms: 1200000
  new_shift_inactivity_grace_period_ms: 300000
  max_validity_range_ms: 480000
  da_attestation_timeout_ms: 3600000
  da_small_response_window_ms: 3600000
  da_full_response_window_ms: 172800000
  da_challenge_window_ms: 259200000
  da_slash_grace_ms: 172800000
  da_bond_withdraw_delay_ms: 778080000 # validity + max(window + full response, maturity) + grace
da_bond:
  da_bond_lovelace: 100000000000
  da_slash_penalty_lovelace: 25000000000
  da_bond_min_top_up_lovelace: 1000000000
  da_bond_pool_floor_lovelace: 5000000
  # min-UTxO of the largest admitted ChallengeRecordV1 (64 tranche
  # descriptors at worst-case field widths, 32-byte DACH token, inline datum,
  # enterprise script address): datum 5,838 B, output 5,953 B,
  # (160 + 5,953) x 4,310 = 26,347,030 lovelace, rounded up to a whole ADA.
  # A stake credential on the address (+28 B) would need 26,467,710.
  challenge_record_lovelace: 27000000
limits:
  max_bisection_rounds: 32
  max_inactivity_strikes: 5
  coins_per_utxo_byte: 4310
economics:
  profile: public-preprod-launch-v1
  requiredBondLovelace: 100000000000
  slashingPenaltyLovelace: 25000000000
  inactivitySlashingPenaltyLovelace: 10000000000
  fraudProverRewardLovelace: 75000000000
  proverCollateralFloorLovelace: 5000000
